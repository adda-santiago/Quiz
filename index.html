<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quiz Iglesia</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f1fa;color:#1d1b2b}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.55em 1em;background:#e6e2f3;color:#1d1b2b;font-weight:600}
button:hover{filter:brightness(.95)}
button.pri{background:var(--c,#6c3ce0);color:#fff}
button.big{font-size:1.25rem;padding:.8em 1.6em}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;padding:.55em .7em;border:2px solid #ddd8ee;border-radius:10px;width:100%;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--c,#6c3ce0)}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:42px;width:80px}
h1,h2,h3{margin:.2em 0}
.sp{flex:1}
/* ---------- Inicio ---------- */
.home{max-width:760px;margin:0 auto;padding:40px 20px;text-align:center}
.home .logo{font-size:64px}
.home .card{background:#fff;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 4px 20px #0001}
.home .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.home .grid button{padding:1em;font-size:1.05rem}
.home .joinrow{display:flex;gap:10px;max-width:360px;margin:10px auto 0}
.muted{color:#6b6880;font-size:.92rem}
/* ---------- Editor ---------- */
.editor{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;box-shadow:0 2px 10px #0001;z-index:2}
.bar .titulo{max-width:360px;font-weight:700}
.ed-body{flex:1;display:flex;min-height:0}
#lista{width:320px;overflow:auto;background:#faf9fe;border-right:1px solid #e6e2f3;padding:10px}
.li{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer;margin-bottom:4px;background:#fff;border:2px solid transparent}
.li.sel{border-color:var(--c,#6c3ce0)}
.li .n{font-size:.8rem;color:#888;width:18px}
.li .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.li .acts{display:none;gap:2px}
.li:hover .acts,.li.sel .acts{display:flex}
.li .acts button{padding:2px 7px;font-size:.8rem}
.add{margin-top:14px}
.add p{margin:4px 0;font-weight:700;font-size:.9rem}
.add button{display:block;width:100%;text-align:left;margin-bottom:4px;background:#fff;border:1px dashed #cfc8e8}
#form{flex:1;overflow:auto;padding:20px 28px;max-width:900px}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
.fld.sm{display:inline-block;width:180px;margin-right:12px;vertical-align:top}
.fila{display:flex;flex-wrap:wrap;gap:0 12px}
.fila .fld.sm{flex:0 1 180px;width:auto;margin-right:0}
.fila .fld.ancho{flex-basis:300px}
.mnav,.macts{display:none}
.chkf{display:flex;gap:8px;align-items:center;margin:12px 0;font-weight:600}
.optrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.optrow input{min-width:0}
.optrow .sh{color:#fff;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;flex:none}
.chk{background:#eee;color:#bbb}
.chk.on{background:#26890c;color:#fff}
.imgrow{display:flex;gap:6px}
.imgrow input{flex:1}
.thumb{max-height:160px;max-width:100%;margin-top:8px;border-radius:10px}
.hint{font-size:.85rem;color:#6b6880;margin:4px 0}
.pinprev{position:relative;display:inline-block;max-width:100%;cursor:crosshair;margin-top:8px}
.pinprev img{display:block;max-width:100%;max-height:420px;border-radius:10px}
.pinmark{position:absolute;aspect-ratio:1;border-radius:50%;background:#e21b3c55;border:3px solid #e21b3c;transform:translate(-50%,-50%);pointer-events:none}
.vfbtns{display:flex;gap:10px}
.vfbtns button.on{background:#26890c;color:#fff}
/* ---------- Editor en teléfono: lista o formulario, uno a la vez ---------- */
@media (max-width:760px){
  .bar{gap:6px;padding:8px 10px}
  .bar .lbl{display:none}
  .bar button{padding:.55em .7em}
  .bar .titulo{flex:1;min-width:0;max-width:none}
  .bar .sp{display:none}
  .editor.vista-lista #form{display:none}
  .editor.vista-form #lista{display:none}
  #lista{width:100%;border-right:0;padding:10px 12px 24px}
  .li{padding:12px 10px}
  .li .acts,.li:hover .acts,.li.sel .acts{display:none}
  .add .tipos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .add button{margin:0;padding:.8em .6em;font-size:.92rem}
  #form{padding:0 14px 28px;max-width:none}
  .mnav{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:1;background:#f3f1fa;padding:10px 0;margin-bottom:4px;border-bottom:1px solid #e6e2f3}
  .mnav .pos{font-weight:700;color:#6b6880;min-width:56px;text-align:center}
  .mnav button{padding:.55em .9em}
  .macts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px;padding-top:14px;border-top:1px solid #e6e2f3}
  .macts button{padding:.7em .3em;font-size:.88rem}
  .macts .peligro{background:#fde3e7;color:#b0102b}
  .fila .fld.sm,.fila .fld.ancho{flex:1 1 140px}
  .fld.sm{width:100%;margin-right:0}
  .optrow{gap:4px}
  .optrow .sh{width:34px;height:34px}
  .optrow button{padding:.5em .6em}
  .vfbtns button{flex:1;padding:.9em}
  input[type=color]{width:100%}
  .pinprev{display:block}
}
/* ---------- Presentación ---------- */
.host{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--c),#1d1b2b);color:#fff}
.host .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px;width:100%}
.hbar{display:flex;gap:10px;align-items:center;padding:12px 18px;background:#0003}
.hbar button{background:#ffffff22;color:#fff}
.hbar button.pri{background:#fff;color:#1d1b2b}
.pill{background:#ffffff22;border-radius:30px;padding:6px 14px;font-weight:700}
.join{display:flex;gap:30px;align-items:center;background:#fff;color:#1d1b2b;border-radius:20px;padding:24px 34px;flex-wrap:wrap;justify-content:center}
.join .qr svg{width:220px;height:220px;display:block}
.join .code{font-size:4rem;font-weight:900;letter-spacing:.12em;color:var(--c)}
.join .url{font-weight:700;word-break:break-all;max-width:380px}
.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.chip{background:#fff;color:#1d1b2b;border-radius:30px;padding:8px 16px;font-weight:700;font-size:1.1rem;cursor:pointer}
.chip.off{opacity:.45}
.chip:hover{text-decoration:line-through}
.warn{background:#ffd93b;color:#1d1b2b;border-radius:12px;padding:10px 16px;font-weight:600;max-width:720px}
.slide h1{font-size:clamp(2rem,6vw,4.5rem)}
.slide p{font-size:clamp(1.2rem,3vw,2.2rem);max-width:1100px;white-space:pre-wrap;margin:0}
.slide img,.qimg{max-height:45vh;max-width:90%;border-radius:16px;box-shadow:0 10px 40px #0005}
.hq-top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1200px;font-weight:700}
.timer{width:84px;height:84px;border-radius:50%;background:#fff;color:#1d1b2b;display:grid;place-items:center;font-size:2.2rem;font-weight:900}
.hq-q{font-size:clamp(1.5rem,4vw,3rem);background:#fff;color:#1d1b2b;border-radius:16px;padding:16px 28px;max-width:1200px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:1200px}
.opt{display:flex;align-items:center;gap:14px;border-radius:14px;padding:18px 22px;font-size:clamp(1.1rem,2.6vw,2rem);font-weight:700;text-align:left;position:relative;overflow:hidden;min-height:90px}
.opt .f{font-size:1.4em}
.opt .cnt{margin-left:auto;font-size:1.1em}
.opt.dim{opacity:.3}
.opt .barra{position:absolute;left:0;bottom:0;height:8px;background:#fff9}
.frase{font-size:clamp(1.4rem,4vw,3rem);font-weight:700;max-width:1100px}
.blank{display:inline-block;min-width:4ch;border-bottom:5px solid #fff;color:#ffd93b}
.lista-ord{display:flex;flex-direction:column;gap:10px;min-width:min(700px,90vw)}
.lista-ord div{background:#fff;color:#1d1b2b;border-radius:12px;padding:12px 18px;font-size:1.5rem;font-weight:700;text-align:left}
.lista-ord b{color:var(--c);margin-right:10px}
.pinhost{position:relative;display:inline-block}
.pinhost img{display:block;max-height:58vh;max-width:90vw;border-radius:14px}
.pinhost .tgt{position:absolute;aspect-ratio:1;border-radius:50%;border:4px solid #26890c;background:#26890c44;transform:translate(-50%,-50%)}
.pinhost .pp{position:absolute;transform:translate(-50%,-100%);font-size:1.7rem;filter:drop-shadow(0 2px 2px #0008)}
.linea{position:relative;width:min(1000px,90vw);height:120px;margin-top:20px}
.linea .eje{position:absolute;left:0;right:0;top:60px;height:6px;background:#fff;border-radius:3px}
.linea .d{position:absolute;top:22px;transform:translateX(-50%);font-size:1.6rem}
.linea .ok{position:absolute;top:40px;transform:translateX(-50%);width:6px;height:46px;background:#26890c;border-radius:3px}
.linea .okl{position:absolute;top:92px;transform:translateX(-50%);font-weight:900;font-size:1.4rem}
.linea .mm{position:absolute;top:92px;font-weight:700}
.nube{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center;max-width:1100px}
.nube span{font-weight:800;line-height:1.1}
.tops{display:flex;flex-direction:column;gap:6px;min-width:min(520px,90vw)}
.tops div{display:flex;justify-content:space-between;background:#ffffff22;padding:8px 14px;border-radius:10px;font-size:1.2rem}
.rank{display:flex;flex-direction:column;gap:10px;width:min(900px,92vw)}
.rk{display:flex;align-items:center;gap:12px;background:#fff;color:#1d1b2b;border-radius:12px;padding:10px 16px;font-size:1.4rem;font-weight:800}
.rk .pos{width:36px;color:var(--c)}
.rk .nm{flex:1;text-align:left}
.rk .plus{font-size:1rem;color:#26890c}
.podio{display:flex;align-items:flex-end;gap:16px}
.podio .col{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:1.3rem}
.podio .blk{width:170px;border-radius:14px 14px 0 0;background:#fff;color:#1d1b2b;display:grid;place-items:center;font-size:2.6rem;font-weight:900}
.podio .av{font-size:3.2rem}
/* ---------- Jugador ---------- */
.jug{min-height:100vh;display:flex;flex-direction:column;background:var(--bg,#3b2a7a);color:#fff;transition:background .3s}
.jug .top{display:flex;justify-content:space-between;padding:12px 16px;font-weight:700;background:#0002}
.jug .cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;gap:14px;text-align:center}
.jug .card{background:#fff;color:#1d1b2b;border-radius:18px;padding:22px;width:100%;max-width:420px}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.avs button{font-size:1.6rem;padding:4px;background:#f0edf9}
.avs button.on{background:var(--c,#6c3ce0);outline:3px solid #1d1b2b}
.jopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;flex:1;max-height:70vh}
.jopts button{color:#fff;font-size:1.15rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px}
.jopts button .f{font-size:2.2rem}
.jq{font-size:1.15rem;font-weight:700;background:#0003;border-radius:12px;padding:10px 14px;width:100%}
.jpin{position:relative;width:100%;max-width:600px}
.jpin img{width:100%;display:block;border-radius:12px}
.jpin .m{position:absolute;transform:translate(-50%,-100%);font-size:2.2rem;pointer-events:none}
.jord{display:flex;flex-direction:column;gap:8px;width:100%;max-width:480px}
.jord div{display:flex;align-items:center;gap:8px;background:#fff;color:#1d1b2b;border-radius:10px;padding:8px 10px;font-weight:700;text-align:left}
.jord span{flex:1}
.jord button{padding:6px 12px}
.jnum{font-size:3.2rem;font-weight:900}
.jug input[type=range]{width:100%;max-width:480px}
.estado-big{font-size:5rem}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   QUIZ IGLESIA — app tipo Kahoot sin base de datos
   - El quiz se guarda/abre como archivo .json
   - Los teléfonos se conectan por WebRTC (PeerJS), sin servidor propio
   ========================================================= */
const app = document.getElementById('app');
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const slug = s => norm(s).replace(/ /g, '-');

const COLORES = ['#e21b3c', '#1368ce', '#d89e00', '#26890c', '#864cbf', '#0aa3a3'];
const FORMAS = ['▲', '◆', '●', '■', '★', '⬟'];
const AVATARES = ['🐑','🦁','🐟','🕊️','🐻','🐸','🦊','🐼','🐯','🐧','🦄','🐝','🐢','🐳','🦉','🐨'];
const PREFIJO = 'quiziglesia-';

const TIPOS = {
  diapositiva: { nombre: 'Diapositiva', icono: '🖼️' },
  alternativas: { nombre: 'Alternativas', icono: '🔤' },
  vf: { nombre: 'Verdadero / Falso', icono: '✅' },
  completar: { nombre: 'Completar la frase', icono: '✏️' },
  pin: { nombre: 'Ubicar el pin', icono: '📍' },
  ordenar: { nombre: 'Ordenar', icono: '🔢' },
  numero: { nombre: 'Adivina el número', icono: '🎚️' },
  encuesta: { nombre: 'Encuesta (sin puntaje)', icono: '📊', sinPuntaje: true },
  nube: { nombre: 'Nube de palabras', icono: '☁️', sinPuntaje: true },
};

function configDefecto() {
  return { titulo: 'Mi quiz', organizacion: '', color: '#6c3ce0', tiempo: 20, puntos: 1000,
    bonusVelocidad: true, rankingCada: 1, mostrarCorrectaTelefono: true, permitirTarde: true };
}
function nuevoItem(tipo) {
  const b = { tipo };
  switch (tipo) {
    case 'diapositiva': return { ...b, titulo: '', texto: '', imagen: '', fondo: '' };
    case 'alternativas': return { ...b, pregunta: '', opciones: ['', '', '', ''], correctas: [0], imagen: '', tiempo: null, mult: 1 };
    case 'vf': return { ...b, pregunta: '', correcta: true, imagen: '', tiempo: null, mult: 1 };
    case 'completar': return { ...b, pregunta: 'Completa la frase', frase: '', aceptadas: '', imagen: '', tiempo: null, mult: 1 };
    case 'pin': return { ...b, pregunta: '', imagen: '', ar: 0.625, x: 50, y: 50, radio: 8, tiempo: null, mult: 1 };
    case 'ordenar': return { ...b, pregunta: '', elementos: ['', '', ''], imagen: '', tiempo: null, mult: 1 };
    case 'numero': return { ...b, pregunta: '', min: 0, max: 100, paso: 1, correcta: 50, tolerancia: 0, unidad: '', imagen: '', tiempo: null, mult: 1 };
    case 'encuesta': return { ...b, pregunta: '', opciones: ['', ''], imagen: '', tiempo: null };
    case 'nube': return { ...b, pregunta: '', imagen: '', tiempo: null };
  }
}
function normalizarQuiz(q) {
  q.config = Object.assign(configDefecto(), q.config || {});
  q.items = (q.items || []).map(it => Object.assign(nuevoItem(TIPOS[it.tipo] ? it.tipo : 'diapositiva'), it));
  return q;
}

/* ---------- Quiz de ejemplo ---------- */
const SVG_OVEJA = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
<rect width="800" height="500" fill="#8fd16a"/><rect width="800" height="170" fill="#bfe6ff"/>
<circle cx="90" cy="60" r="32" fill="#ffd93b"/>
<path d="M0 170 L120 80 L240 170Z" fill="#7a9a6a"/><path d="M180 170 L330 50 L480 170Z" fill="#6b8a5b"/>
<path d="M420 170 L560 95 L700 170Z" fill="#7a9a6a"/><path d="M600 170 L720 70 L840 170Z" fill="#6b8a5b"/>
<rect x="40" y="225" width="320" height="210" fill="#9fdc7c" stroke="#8b5a2b" stroke-width="8"/>
<g font-size="44"><text x="70" y="290">🐑</text><text x="150" y="300">🐑</text><text x="250" y="285">🐑</text>
<text x="90" y="380">🐑</text><text x="190" y="370">🐑</text><text x="280" y="400">🐑</text><text x="200" y="425">🐑</text></g>
<text x="420" y="300" font-size="40">🌳</text><text x="520" y="250" font-size="52">🌳</text><text x="470" y="460" font-size="36">🪨</text>
<text x="668" y="385" font-size="44">🐑</text>
<ellipse cx="660" cy="405" rx="75" ry="40" fill="#3f8f3a"/><ellipse cx="610" cy="395" rx="40" ry="30" fill="#4aa043"/>
</svg>`;
const IMG_OVEJA = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(SVG_OVEJA);

function ejemploQuiz() {
  const I = (t, o) => Object.assign(nuevoItem(t), o);
  return normalizarQuiz({
    config: { ...configDefecto(), titulo: 'Quiz Bíblico de ejemplo', organizacion: 'Escuela Dominical' },
    items: [
      I('diapositiva', { titulo: '¡Bienvenidos al Quiz Bíblico!', texto: 'Saca tu teléfono, escanea el código QR y prepárate 🙌' }),
      I('alternativas', { pregunta: '¿Cuántos días y noches llovió en el diluvio?', opciones: ['7', '12', '40', '100'], correctas: [2] }),
      I('vf', { pregunta: 'Jonás fue tragado por un gran pez.', correcta: true }),
      I('diapositiva', { titulo: 'Jesús, el Buen Pastor', texto: '«Yo soy el buen pastor: el buen pastor su vida da por las ovejas.»\nJuan 10:11 (RV 1909)' }),
      I('pin', { pregunta: 'La oveja perdida: ¡toca dónde está escondida!', imagen: IMG_OVEJA, ar: 0.625, x: 86.3, y: 74, radio: 7 }),
      I('completar', { pregunta: 'Completa el versículo (Juan 3:16)', frase: 'Porque de tal manera amó Dios al ___', aceptadas: 'mundo' }),
      I('ordenar', { pregunta: 'Ordena lo que Dios creó cada día', elementos: ['La luz', 'El cielo', 'La tierra seca y las plantas', 'El sol, la luna y las estrellas', 'Los peces y las aves', 'Los animales y el ser humano'], tiempo: 40 }),
      I('numero', { pregunta: '¿Cuántos discípulos eligió Jesús?', min: 0, max: 20, correcta: 12, tolerancia: 0 }),
      I('encuesta', { pregunta: '¿Cuál es tu historia bíblica favorita?', opciones: ['David y Goliat', 'Daniel y los leones', 'El arca de Noé', 'Jesús camina sobre el agua'] }),
      I('nube', { pregunta: 'En una palabra: ¿qué significa Dios para ti?', tiempo: 30 }),
      I('diapositiva', { titulo: '¡Gracias por jugar! 🎉', texto: 'Dios les bendiga' }),
    ]
  });
}

/* ---------- Archivo / almacenamiento ---------- */
const LS = 'quiziglesia.quiz';
let quiz = (() => { try { const q = JSON.parse(localStorage.getItem(LS)); return q && q.items ? normalizarQuiz(q) : ejemploQuiz(); } catch (e) { return ejemploQuiz(); } })();
function guardarLocal() { try { localStorage.setItem(LS, JSON.stringify(quiz)); } catch (e) { console.warn('No se pudo autoguardar (archivo muy grande)'); } }
function bajar(nombre, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function descargarQuiz() { bajar((slug(quiz.config.titulo) || 'quiz') + '.quiz.json', JSON.stringify(quiz, null, 2), 'application/json'); }
function abrirArchivo(cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    f.text().then(t => {
      try { const q = JSON.parse(t); if (!q.items) throw 0; quiz = normalizarQuiz(q); guardarLocal(); cb && cb(); }
      catch (e) { alert('El archivo no es un quiz válido.'); }
    });
  };
  i.click();
}
function leerImagen(cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      if (f.type === 'image/svg+xml' || f.type === 'image/gif') return cb(r.result);
      const img = new Image();
      img.onload = () => { // reducir para que el archivo no pese demasiado
        const max = 1200, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  i.click();
}

/* ---------- Utilidades de juego ---------- */
const tiempoDe = it => Number(it.tiempo) || Number(quiz.config.tiempo) || 20;
const aceptadas = it => String(it.aceptadas || '').split(',').map(norm).filter(Boolean);
const opcionesValidas = arr => arr.map((o, i) => ({ o, i })).filter(x => String(x.o).trim());
const esPregunta = it => it.tipo !== 'diapositiva';
function evaluar(it, v) {
  try {
    switch (it.tipo) {
      case 'alternativas': return it.correctas.includes(Number(v));
      case 'vf': return v === it.correcta;
      case 'completar': return aceptadas(it).includes(norm(v));
      case 'pin': { const dx = v.x - it.x, dy = (v.y - it.y) * (it.ar || 1); return Math.hypot(dx, dy) <= it.radio; }
      case 'ordenar': { const ok = opcionesValidas(it.elementos).map(x => x.i); return Array.isArray(v) && v.length === ok.length && v.every((x, k) => x === ok[k]); }
      case 'numero': return Math.abs(Number(v) - Number(it.correcta)) <= Number(it.tolerancia || 0);
    }
  } catch (e) { }
  return false;
}
function textoCorrecta(it) {
  switch (it.tipo) {
    case 'alternativas': return it.correctas.map(i => it.opciones[i]).join(' / ');
    case 'vf': return it.correcta ? 'Verdadero' : 'Falso';
    case 'completar': return String(it.aceptadas).split(',')[0].trim();
    case 'pin': return '📍 Mira la pantalla';
    case 'ordenar': return opcionesValidas(it.elementos).map(x => x.o).join(' → ');
    case 'numero': return it.correcta + (it.unidad ? ' ' + it.unidad : '');
  }
  return '';
}

/* =================== PRESENTAR (pantalla principal) =================== */
let H = null;
function detenerHost() { if (H) { clearInterval(H.timer); try { H.peer && H.peer.destroy(); } catch (e) { } H = null; } }
function vistaPresentar() {
  if (!quiz.items.length) { alert('El quiz está vacío.'); return; }
  detenerHost();
  H = { code: String(Math.floor(10000 + Math.random() * 90000)), players: {}, idx: -1, fase: 'lobby', resp: {}, t0: 0, timer: null, peer: null, estado: 'conectando', ult: {} };
  iniciarPeerHost();
  document.onkeydown = e => { if (H && ['ArrowRight', ' ', 'PageDown', 'Enter'].includes(e.key) && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) { e.preventDefault(); avanzar(); } };
  ACC = {
    next: avanzar,
    salir: () => { if (confirm('¿Salir de la presentación? Se perderá el puntaje.')) vistaInicio(); },
    fs: () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.(),
    kick: el => { const p = H.players[el.dataset.pid]; if (p && confirm('¿Sacar a ' + p.name + ' de la sala?')) { enviar(p, { t: 'kick' }); delete H.players[p.pid]; renderHost(); } },
    csv: descargarResultados,
    inicio: vistaInicio,
  };
  renderHost();
}
function iniciarPeerHost() {
  if (!window.Peer) { H.estado = 'sinpeer'; return; }
  const peer = new Peer(PREFIJO + H.code);
  H.peer = peer;
  peer.on('open', () => { H.estado = 'ok'; if (H.fase === 'lobby') renderHost(); });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { H.code = String(Math.floor(10000 + Math.random() * 90000)); peer.destroy(); iniciarPeerHost(); }
    else if (e.type !== 'peer-unavailable') { H.estado = 'error'; console.warn(e); if (H.fase === 'lobby') renderHost(); }
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) { } });
  peer.on('connection', conn => {
    conn.on('data', d => alRecibirHost(conn, d));
    conn.on('close', () => { const p = H && H.players[conn.pid]; if (p && p.conn === conn) { p.online = false; if (H.fase === 'lobby') renderHost(); } });
  });
}
function enviar(p, msg) { try { if (p.conn && p.conn.open) p.conn.send(msg); } catch (e) { } }
function difundir(msg) { Object.values(H.players).forEach(p => enviar(p, msg)); }
const conectados = () => Object.values(H.players).filter(p => p.online);
function alRecibirHost(conn, d) {
  if (!H || !d) return;
  if (d.t === 'join') {
    let p = H.players[d.pid];
    if (!p) {

      const corr = d.correcta ? `<p>Respuesta: <b>${esc(d.correcta)}</b></p>` : '';
      const pos = `<p>Vas en el lugar <b>${d.rank}</b> de ${d.n}</p>`;
      if (d.ok === null) pantallaJ('🙌', '¡Gracias por participar!', '#864cbf');
      else if (!d.resp) pantallaJ('⏰', 'Se acabó el tiempo', '#555', corr + pos);
      else if (d.ok) pantallaJ('🎉', `¡Correcto!<br>+${d.pts}`, '#26890c', pos);
      else pantallaJ('😮', 'Incorrecto', '#e21b3c', corr + pos);
      break;
    }
    case 'fin': P.fin = true; pantallaJ(d.rank <= 3 ? ['🥇', '🥈', '🥉'][d.rank - 1] : '🎉', `¡Terminó!<br>Quedaste en el lugar ${d.rank} de ${d.n}`, 'var(--c)', `<p>${d.score} puntos</p>`); break;
    case 'kick': P.kicked = true; pantallaJ('🚪', 'El presentador te sacó de la sala.', '#555'); try { P.peer.destroy(); } catch (e) { } break;
  }
}
function responder(v) {
  const q = P.q; if (!q) return;
  if (q.tipo === 'alternativas' || q.tipo === 'encuesta') v = Number(v);
  if (q.tipo === 'vf') v = v === 'true';
  P.conn.send({ t: 'ans', idx: q.idx, val: v });
  P.q = null;
  pantallaJ('📨', 'Enviando…');
}
function renderJPregunta(soloLista) {
  const q = P.q; if (!q) return;
  if (soloLista) { $('#jord').innerHTML = filasOrden(); return; }
  let h = `<div class="jq">${esc(q.pregunta)}</div>`;
  switch (q.tipo) {
    case 'alternativas': case 'encuesta':
      h += `<div class="jopts">${q.opciones.map(({ o, i }) => `<button data-a="jv" data-v="${i}" style="background:${COLORES[i % 6]}"><span class="f">${FORMAS[i % 6]}</span>${esc(o)}</button>`).join('')}</div>`; break;
    case 'vf':
      h += `<div class="jopts"><button data-a="jv" data-v="true" style="background:${COLORES[1]}"><span class="f">◆</span>Verdadero</button><button data-a="jv" data-v="false" style="background:${COLORES[0]}"><span class="f">▲</span>Falso</button></div>`; break;
    case 'completar': case 'nube':
      if (q.frase) h += `<div class="jq" style="background:#fff2">${esc(q.frase).replace(/_{3,}/, '<b>_____</b>')}</div>`;
      h += `<input id="jtxt" maxlength="40" autocomplete="off" placeholder="Escribe aquí…" style="max-width:420px;font-size:1.3rem"><button class="pri big" data-a="jenviar" style="background:#fff;color:#1d1b2b">Enviar</button>`; break;
    case 'numero':
      h += `<div class="jnum" id="jval">${Math.round((q.min + q.max) / 2)}</div><div>${esc(q.unidad || '')}</div>
        <input type="range" id="jrange" min="${q.min}" max="${q.max}" step="${q.paso}" value="${Math.round((q.min + q.max) / 2)}">
        <button class="pri big" data-a="jenviar" style="background:#fff;color:#1d1b2b">Enviar</button>`; break;
    case 'pin':
      h += `<div class="jpin" data-a="jpin"><img src="${esc(q.imagen)}"><span class="m" id="jm" style="display:none">📍</span></div>
        <button class="pri big" id="jsend" data-a="jenviar" disabled style="background:#fff;color:#1d1b2b">Confirmar</button>`; break;
    case 'ordenar':
      h += `<div class="jord" id="jord">${filasOrden()}</div><button class="pri big" data-a="jenviar" style="background:#fff;color:#1d1b2b">Enviar orden</button>`; break;
  }
  marcoJ(h);
  const r = $('#jrange'); if (r) r.oninput = () => $('#jval').textContent = r.value;
  const t = $('#jtxt'); if (t) { t.focus(); t.onkeydown = e => { if (e.key === 'Enter') ACC.jenviar(); }; }
  clearInterval(P.tInt);
  const tick = () => { const s = Math.max(0, Math.ceil((P.limite - Date.now()) / 1000)); const el = $('#jt'); if (el) el.textContent = '⏱ ' + s; if (s <= 0) { clearInterval(P.tInt); } };
  tick(); P.tInt = setInterval(tick, 250);
}
function filasOrden() {
  return P.orden.map((x, k) => `<div><b>${k + 1}</b><span>${esc(x.o)}</span><button data-a="jmov" data-i="${k}" data-d="-1">▲</button><button data-a="jmov" data-i="${k}" data-d="1">▼</button></div>`).join('');
}

iniciar();
</script>
</body>
