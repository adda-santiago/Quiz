<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quiz Iglesia</title>
<meta name="theme-color" content="#FDF8FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Source+Code+Pro:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* =========================================================
   Sistema de diseño "Sanctuary Tech — Quiz Iglesia" (Google Stitch)
   ========================================================= */
:root{
  --c:#180157; /* primario (se puede cambiar en la configuración del quiz) */
  --primary-container:#2D1E6B; --on-primary-container:#E6DEFF;
  --secondary:#006780; --secondary-container:#76DCFF; --on-secondary-container:#003543;
  --tertiary:#A21CAF; --tertiary-container:#FAE8FF; --on-tertiary-container:#701A75;
  --gold:#F59E0B; --cyan:#06B6D4; --violet:#7C3AED;
  --success:#059669; --success-container:#D1FAE5; --warning:#D97706; --error:#BA1A1A; --error-container:#FFDAD6;
  --bg:#FDF8FF; --s-lowest:#FFFFFF; --s-low:#F7F2F9; --s:#F1ECF4; --s-high:#EBE6EE; --s-highest:#E6E1E8;
  --on-s:#1C1B20; --on-s-var:#484550; --outline:#797582; --outline-var:#C9C4D2;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Source Code Pro",ui-monospace,Menlo,monospace;
  --sombra:0 1px 2px #1801570f,0 6px 20px #1801570d;
  --r-md:12px; --r-lg:16px; --r-xl:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--on-s);-webkit-font-smoothing:antialiased;line-height:1.4}
h1,h2,h3{margin:.2em 0;line-height:1.15}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.25px;color:var(--c)}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:1.3em;line-height:1;display:inline-block;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';vertical-align:-.22em;overflow:hidden;max-width:1.3em}
.ms.fill{font-variation-settings:'FILL' 1}
.ms.gold,.fila2 .ms.gold{color:var(--gold)}
.sp{flex:1}
.muted{color:var(--on-s-var);font-size:.95rem}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--outline-var);border-radius:var(--r-md);padding:.6em 1.1em;background:var(--s-low);color:var(--on-s);display:inline-flex;align-items:center;justify-content:center;gap:.5em;transition:background-color .12s ease-out,border-color .12s ease-out,transform .12s ease-out}
button:hover{background:var(--s-high)}
button:active{transform:scale(.98)}
button.pri{background:var(--c);border-color:var(--c);color:#fff}
button.pri:hover{background:var(--c);filter:brightness(1.25)}
button.sec{background:var(--secondary);border-color:var(--secondary);color:#fff}
button.sec:hover{background:var(--secondary);filter:brightness(1.15)}
button.big{font-size:1.05rem;padding:.9em 1.6em}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
input,textarea,select{font:inherit;padding:.65em .85em;border:1px solid var(--outline-var);border-radius:var(--r-md);width:100%;background:var(--s-lowest);color:var(--on-s)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px #1801571f}
input[type=checkbox]{width:auto;accent-color:var(--c);width:18px;height:18px}
input[type=range]{accent-color:var(--c);padding:0;border:0}
input[type=color]{padding:3px;height:44px;width:84px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-size:.8rem;font-weight:600;letter-spacing:.2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.cyan{background:var(--secondary-container);color:var(--on-secondary-container)}
.badge.ind{background:var(--primary-container);color:var(--on-primary-container)}
.badge.ind .ms{color:var(--cyan)}
.badge.mag{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.badge.out{background:var(--s-lowest);border:1px solid var(--outline-var);color:var(--secondary)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--secondary)}
.logo{width:44px;height:44px;border-radius:var(--r-md);background:var(--c);display:grid;place-items:center;flex:none;box-shadow:var(--sombra)}
.logo .ms{color:var(--gold);font-size:28px;max-width:none}
.card{background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-xl);box-shadow:var(--sombra)}
.top{background:color-mix(in srgb,var(--bg) 95%,transparent);border-bottom:1px solid var(--outline-var);position:sticky;top:0;z-index:5}
.top-in{max-width:1168px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:14px;min-width:0}
.marca b{display:block;color:var(--c);font-size:1.05rem;line-height:1.2}
.marca small{display:block;color:var(--on-s-var);font-size:.78rem;font-weight:600}
.ibtn{width:42px;height:42px;padding:0;border-radius:50%;background:var(--s)}
.ibtn .ms{max-width:none}
.eyebrow{display:block;font-size:.78rem;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--gold)}
/* ---------- Inicio ---------- */
.inicio{min-height:100vh;display:flex;flex-direction:column}
.home{flex:1;width:100%;max-width:1168px;margin:0 auto;padding:48px 24px}
.hero{text-align:center;max-width:720px;margin:0 auto 48px}
.hero h1{font-size:clamp(2.2rem,5.4vw,3.6rem);line-height:1.08;margin:18px 0 16px}
.hero .lead{color:var(--on-s-var);font-size:1.05rem;margin:0}
.home-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:start}
.qcard{overflow:hidden}
.qhead{background:var(--primary-container);color:#fff;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.qhead h2{color:#fff;font-size:2rem;margin:4px 0 0}
.qhead .badge{background:#ffffff14;border:1px solid #ffffff40;color:#fff}
.qhead .badge .ms{color:var(--cyan)}
.qbody{padding:28px 32px 32px}
.qbody p.muted{margin:0 0 20px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fila2 button{justify-content:flex-start;padding:.85em 1.1em;background:var(--s-low)}
.fila2 button.pri,.fila2 button.big{justify-content:center}
.fila2 button.pri{background:var(--c)}
.sep{border:0;border-top:1px solid var(--outline-var);margin:28px 0 20px}
.lbl-sm{font-size:.82rem;font-weight:600;color:var(--on-s-var);margin:0 0 10px}
.fila2 .ms{color:var(--c)}
.fila2 .pri .ms{color:var(--gold)}
.jcard{padding:32px;background:var(--s-low);display:flex;flex-direction:column;gap:14px}
.jcard .cab{display:flex;align-items:center;justify-content:space-between}
.tile{width:48px;height:48px;border-radius:var(--r-md);background:var(--secondary-container);color:var(--on-secondary-container);display:grid;place-items:center}
.tile .ms{max-width:none;font-size:28px}
.jcard h2{font-size:2.2rem;margin:4px 0 0}
.jcard p{margin:0;color:var(--on-s-var)}
.campo-cod{position:relative}
.campo-cod .ms{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--secondary)}
.campo-cod input{padding:.75em .9em .75em 48px;font-family:var(--mono);font-size:1.5rem;font-weight:700;letter-spacing:.25em}
.campo-cod input::placeholder{letter-spacing:.1em;font-weight:600;color:var(--outline)}
.etq{font-weight:600;font-size:.9rem;margin-top:6px}
.nota{display:flex;gap:10px;align-items:flex-start;background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);padding:14px 16px;font-size:.92rem;color:var(--on-s-var)}
.nota .ms{color:var(--gold)}
.pie{border-top:1px solid var(--outline-var);background:var(--s)}
.pie .top-in{font-size:.9rem;color:var(--on-s-var);justify-content:space-between}
@media (max-width:860px){
  .home{padding:24px 16px}
  .hero{text-align:left;margin-bottom:24px}
  .hero .badge{display:none}
  .hero h1{font-size:2.1rem;margin:0 0 8px}
  .hero .lead{font-size:.95rem}
  .home-grid{grid-template-columns:1fr;gap:20px}
  .jcard{order:-1;padding:22px}
  .qhead{padding:18px 22px}
  .qhead h2{font-size:1.7rem}
  .qbody{padding:20px 22px 22px}
  .qbody p.muted{display:none}
  .fila2.small button{font-size:.88rem;padding:.7em .8em}
  .larga{display:none}.corta{display:inline}
  .top-in{padding:12px 16px}
}
/* ---------- Editor ---------- */
.editor{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--s-lowest);border-bottom:1px solid var(--outline-var);z-index:2}
.bar .titulo{max-width:380px;font-weight:600}
.bar button{white-space:nowrap}
.sprops .seg{flex-wrap:wrap}
.bar .ms{color:var(--c);max-width:none}
.bar .pri .ms{color:var(--gold)}
.ed-body{flex:1;display:flex;min-height:0}
#lista{width:330px;overflow:auto;background:var(--s-low);border-right:1px solid var(--outline-var);padding:12px}
.li{display:flex;align-items:center;gap:8px;padding:10px;border-radius:var(--r-md);cursor:pointer;margin-bottom:6px;background:var(--s-lowest);border:1px solid var(--outline-var)}
.li:hover{border-color:var(--outline)}
.li.sel{border:2px solid var(--c);padding:9px;box-shadow:var(--sombra)}
.li .n{font-size:.8rem;color:var(--outline);width:20px;font-family:var(--mono)}
.li .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.li .acts{display:none;gap:2px}
.li:hover .acts,.li.sel .acts{display:flex}
.li .acts button{padding:2px 7px;font-size:.8rem;border-radius:8px}
.add{margin-bottom:12px}
.add .add-btn{width:100%;justify-content:center;gap:8px;padding:.75em 1em;font-size:1rem}
.add .add-btn .ms:last-child{margin-left:auto}
.add-menu{margin-top:8px;background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);padding:10px;box-shadow:var(--sombra)}
.add-menu>p{margin:0 0 6px;font-size:.8rem}
.add-g h4{margin:10px 2px 6px;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--on-s-var);font-weight:700}
.add-g .tipos{display:flex;flex-direction:column;gap:4px}
.add-g button{display:flex;align-items:center;justify-content:flex-start;gap:10px;width:100%;text-align:left;margin:0;padding:.5em .7em;background:transparent;border:1px solid transparent;font-weight:500}
.add-g button:hover,.add-g button:focus-visible{border-color:var(--c);background:var(--s-low)}
.add-g button .ico{font-size:1.15rem;width:24px;text-align:center;flex:none}
.add-g button b{font-weight:600;font-size:.92rem}
.add-g button small{display:none}
#tipTipo{position:fixed;z-index:40;width:280px;background:var(--c);color:#fff;border-radius:12px;padding:10px 14px;font-size:.88rem;line-height:1.4;box-shadow:0 10px 30px #0004;pointer-events:none;opacity:0;transform:translateX(-4px);transition:opacity .12s,transform .12s}
#tipTipo.ver{opacity:1;transform:none}
#tipTipo b{display:block;margin-bottom:4px;font-size:.95rem}
#form{flex:1;overflow:auto;padding:24px 32px;max-width:920px}
#form>h2{font-size:2.2rem}
.fld{display:block;margin:14px 0}
.fld>span{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--on-s)}
.fld.sm{display:inline-block;width:180px;margin-right:12px;vertical-align:top}
.fila{display:flex;flex-wrap:wrap;gap:0 12px}
.fila .fld.sm{flex:0 1 180px;width:auto;margin-right:0}
.fila .fld.ancho{flex-basis:300px}
.mnav,.macts{display:none}
.chkf{display:flex;gap:10px;align-items:center;margin:14px 0;font-weight:600}
.optrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.optrow input{min-width:0}
.optrow .sh{color:#fff;width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;flex:none;font-weight:700}
.chk{background:var(--s);color:var(--outline-var)}
.chk.on{background:var(--success);border-color:var(--success);color:#fff}
.imgrow{display:flex;gap:6px}
.imgrow input{flex:1}
.thumb{max-height:160px;max-width:100%;margin-top:8px;border-radius:var(--r-md)}
.hint{font-size:.85rem;color:var(--on-s-var);margin:4px 0}
.pinprev{position:relative;display:inline-block;max-width:100%;cursor:crosshair;margin-top:8px;touch-action:none;user-select:none;-webkit-user-select:none}
.pinprev.arrastrando,.pinprev.arrastrando *{cursor:grabbing!important}
.pinprev .pinmark,.pinprev .zmark{pointer-events:auto;cursor:grab}
.pinprev img{display:block;max-width:100%;max-height:420px;border-radius:var(--r-md)}
.pinmark{position:absolute;aspect-ratio:1;border-radius:50%;background:#BA1A1A44;border:3px solid var(--error);transform:translate(-50%,-50%);pointer-events:none}
.vfbtns{display:flex;gap:10px}
.vfbtns button.on{background:var(--success);border-color:var(--success);color:#fff}
.clb{background:var(--s);color:var(--outline);min-width:44px;padding:.5em .5em}
.clb.on{background:var(--cc);border-color:var(--cc);color:#fff}
.parrow>span{font-weight:700;color:var(--outline)}
.ubi{background:var(--s);filter:grayscale(1);opacity:.45}
.ubi.on{background:#FEF3C7;border-color:var(--gold);filter:none;opacity:1}
.aviso{color:var(--error);font-weight:600}
@media (max-width:760px){
  .bar{gap:6px;padding:8px 10px}
  .bar .lbl{display:none}
  .bar button{padding:.55em .7em}
  .bar{flex-wrap:wrap}
  .bar .titulo{order:10;flex:1 1 100%;min-width:0;max-width:none}
  .bar .sp{display:none}
  .bar #bUndo,.bar #bRedo{padding:.55em .45em}
  .bar .guardado{display:none}
  .bar .sp{display:none}
  .editor.vista-lista #form{display:none}
  .editor.vista-form #lista{display:none}
  #lista{width:100%;border-right:0;padding:12px 12px 24px}
  .li{padding:12px 10px}
  .li.sel{padding:11px 9px}
  .li .acts,.li:hover .acts,.li.sel .acts{display:none}
  .add-g button{align-items:flex-start;padding:.7em .6em;border-color:var(--outline-var);background:var(--s-lowest)}
  .add-g button small{display:block;font-size:.78rem;color:var(--on-s-var);font-weight:400;margin-top:2px;line-height:1.3}
  #tipTipo{display:none}
  #form{padding:0 14px 28px;max-width:none}
  #form>h2{font-size:1.9rem}
  .mnav{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:1;background:var(--bg);padding:10px 0;margin-bottom:4px;border-bottom:1px solid var(--outline-var)}
  .mnav .pos{font-weight:700;color:var(--on-s-var);min-width:56px;text-align:center;font-family:var(--mono)}
  .mnav button{padding:.55em .9em}
  .macts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px;padding-top:14px;border-top:1px solid var(--outline-var)}
  .macts button{padding:.7em .3em;font-size:.86rem}
  .macts .peligro{background:var(--error-container);border-color:var(--error-container);color:#93000A}
  .fila .fld.sm,.fila .fld.ancho{flex:1 1 140px}
  .fld.sm{width:100%;margin-right:0}
  .optrow{gap:4px}
  .optrow .sh{width:36px;height:36px}
  .optrow button{padding:.5em .6em}
  .vfbtns button{flex:1;padding:.9em}
  input[type=color]{width:100%}
  .pinprev{display:block}
}
/* ---------- Presentación (pantalla grande) ---------- */
.host{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.host .top-in{justify-content:space-between}
.pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prog{height:6px;background:var(--s-high)}
.prog i{display:block;height:100%;background:var(--cyan);transition:width .3s ease}
.stage{flex:1;width:100%;max-width:1168px;margin:0 auto;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.ctl{width:100%;max-width:1168px;margin:0 auto;padding:0 24px 20px}
.ctl-in{display:flex;align-items:center;gap:12px;background:var(--s-low);border:1px solid var(--outline-var);border-radius:var(--r-xl);padding:14px 16px 14px 24px;color:var(--on-s-var);font-size:.92rem}
.ctl-in>.ms{color:var(--secondary)}
.ctl-in button.pri .ms{color:var(--gold)}
.warn{background:#FEF3C7;color:#78350F;border:1px solid #FCD34D;border-radius:var(--r-lg);padding:12px 18px;font-weight:600;max-width:760px}
.join{display:flex;gap:36px;align-items:center;padding:28px 36px;flex-wrap:wrap;justify-content:center;text-align:left}
.join .qr svg{width:220px;height:220px;display:block}
.join p{margin:4px 0;color:var(--on-s-var)}
.join .code{font-family:var(--mono);font-size:4.2rem;font-weight:700;letter-spacing:.14em;color:var(--c);line-height:1.1}
.join .url{font-weight:700;word-break:break-all;max-width:380px;color:var(--secondary)}
.lobby-t,.stage>h1{font-size:clamp(2.4rem,5vw,3.6rem);margin:0}
.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.chip{background:var(--s-lowest);border:1px solid var(--outline-var);color:var(--on-s);border-radius:999px;padding:8px 16px;font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:var(--sombra)}
.chip.off{opacity:.45}
.chip:hover{text-decoration:line-through;border-color:var(--error)}
.qimg{max-height:42vh;max-width:90%;border-radius:var(--r-lg);box-shadow:var(--sombra)}
.hq-card{width:100%;text-align:left;padding:28px 32px;display:flex;flex-direction:column;gap:18px}
.hq-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;border-radius:999px;padding:6px 16px;font-family:var(--mono);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.timer .ms{color:var(--gold)}
.hq-q{font-family:var(--serif);font-size:clamp(2rem,4.2vw,3.5rem);line-height:1.1;color:var(--c);margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.opt{display:flex;align-items:center;gap:20px;background:var(--s-lowest);border:2px solid var(--outline-var);border-radius:var(--r-xl);padding:20px 24px;font-size:clamp(1.1rem,2.1vw,1.6rem);font-weight:600;text-align:left;position:relative;overflow:hidden;box-shadow:var(--sombra);min-height:96px}
.opt .f{width:56px;height:56px;border-radius:var(--r-lg);background:var(--oc);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:700;flex:none}
.opt .cnt{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:1.3em;color:var(--on-s-var)}
.opt.ok{border-color:var(--success);background:#ECFDF5}
.opt.ok .cnt{color:var(--success)}
.opt.dim{opacity:.38}
.opt .barra{position:absolute;left:0;bottom:0;height:6px;background:var(--oc);opacity:.55}
.frase{font-family:var(--serif);font-size:clamp(1.8rem,4vw,3.2rem);line-height:1.2;color:var(--c);max-width:1100px}
.blank{display:inline-block;min-width:4ch;border-bottom:5px solid var(--gold);color:var(--tertiary)}
.lista-ord{display:flex;flex-direction:column;gap:10px;min-width:min(700px,90vw)}
.lista-ord div{background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);padding:12px 18px;font-size:1.4rem;font-weight:600;text-align:left;box-shadow:var(--sombra)}
.lista-ord b{color:var(--c);margin-right:12px;font-family:var(--mono)}
.pinhost{position:relative;display:inline-block}

.conex{font-size:.85rem;color:var(--on-s-var)}

.blank small{font-family:var(--mono);font-size:.5em;color:var(--outline);vertical-align:middle}
.lista-ord.rafaga div{display:flex;align-items:center;gap:12px}

.mascara{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.mascara span{width:clamp(44px,6vw,84px);height:clamp(56px,7.5vw,100px);border-radius:var(--r-md);background:var(--s-lowest);border:2px solid var(--outline-var);display:grid;place-items:center;font:700 clamp(1.6rem,4vw,3.2rem) var(--mono);color:var(--c);box-shadow:var(--sombra);transition:background .3s,transform .3s}

.zoomwrap{height:clamp(170px,calc(100vh - 560px),520px);height:clamp(170px,calc(100dvh - 560px),520px);max-width:100%;aspect-ratio:16/10;overflow:hidden;border-radius:var(--r-xl);box-shadow:var(--sombra);background:#000}

.zmark{position:absolute;width:28px;height:28px;border:3px solid var(--gold);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 3px #0006}
.audiobox{display:flex;flex-direction:column;align-items:center;gap:16px}
.ondas{display:flex;gap:6px;align-items:flex-end;height:70px}

.ondas i:nth-child(odd){animation-delay:.2s!important;background:var(--tertiary)}.ondas i:nth-child(3n){animation-delay:.45s!important}
@keyframes onda{0%,100%{height:20%}50%{height:100%}}
.cartas-deco{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:700px}
.cartas-deco i{width:64px;height:84px;border-radius:12px;background:linear-gradient(135deg,var(--c),var(--tertiary));box-shadow:var(--sombra)}
.cola{display:flex;flex-direction:column;gap:10px;width:min(820px,92vw)}
.cola>div{display:flex;align-items:center;gap:14px;background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);padding:10px 16px;font-size:1.4rem;font-weight:600;box-shadow:var(--sombra)}
.cola>div.act{border:3px solid var(--tertiary);background:var(--tertiary-container)}

.cola .nm{flex:1;text-align:left}
.cola button.ok{background:var(--success);border-color:var(--success);color:#fff}
.cola button.no{background:var(--error);border-color:var(--error);color:#fff}
.buzz-espera{font-size:7rem;animation:anZoom 1s ease-in-out infinite alternate}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;width:100%}
.galeria figure{margin:0;background:#fff;border-radius:var(--r-lg);padding:8px;box-shadow:var(--sombra);cursor:pointer}
.galeria img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;display:block}

.nota-m:nth-child(3n){background:var(--tertiary-container);border-color:#F0ABFC}.nota-m:nth-child(3n+1){background:#DDF4FF;border-color:#76DCFF}

.jfrase,#jfrase{line-height:2.1}
.hueco{display:inline-flex;align-items:center;justify-content:center;min-width:56px;padding:2px 10px;margin:0 3px;border-bottom:3px solid var(--gold);color:var(--outline);font-family:var(--mono);font-size:.85rem}

.jopts.multi button.on{border-color:var(--oc);background:#F7F2F9}
.chk-m{margin-left:auto;color:var(--c)}
.raf-af{font-size:1.4rem!important;text-align:center;min-height:90px;display:grid;place-items:center}

.carta{aspect-ratio:3/4;padding:4px;font-size:1.1rem;font-weight:700;background:linear-gradient(135deg,var(--c),var(--tertiary));color:#fff;border:0;border-radius:12px;overflow:hidden;word-break:break-word}
.carta.vis{background:var(--s-lowest);color:var(--on-s);border:2px solid var(--outline-var)}
.carta.hecha{background:var(--success-container);border-color:var(--success);color:#065F46}

.buzz:active{transform:translateY(8px);box-shadow:0 4px 0 #4A044E}
.jdib{width:100%;max-width:480px;background:#fff;border-radius:var(--r-lg);border:1px solid var(--outline-var);overflow:hidden}

.jdib-bar .sw{width:32px;height:32px}.jdib-bar .sw.on{box-shadow:0 0 0 3px var(--c)}
.jdib-bar button:not(.sw){padding:.4em .7em}
/* ---------- Bloque 5: Mis quizzes, vista previa, importar, tutorial, fondo ---------- */
.misq{margin-top:32px;padding:24px 28px}
.misq-cab{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.misq-cab h2{display:flex;align-items:center;gap:8px;font-size:1.8rem;margin:0}

.mq-t{flex:1;min-width:0}
.mq-t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mq button{padding:.5em .7em}
.mq.act b{color:var(--c)}
.solo-cel{display:none!important}
.corta{display:none}
.menu-mas{position:absolute;right:10px;top:58px;background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);box-shadow:var(--sombra);padding:6px;display:flex;flex-direction:column;z-index:10}

.menu-mas button{justify-content:flex-start;border:0;background:transparent}
.bar{position:relative}
.capa{position:fixed;inset:0;z-index:40;background:#0f0e12b3;display:grid;place-items:center;padding:16px;animation:anFundido .2s}

.vp-tel small{color:var(--on-s-var)}
html.modo-vista .host .ctl,html.modo-vista .host .pills button{display:none}
.imp{width:min(720px,100%);max-height:100%;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:10px}
.imp-cab{display:flex;align-items:center;justify-content:space-between}
.imp-cab h2{display:flex;align-items:center;gap:8px;margin:0}
.imp textarea{font-family:var(--mono);font-size:.9rem}
.imp-res{margin:0;font-weight:600}
.capa.tour{background:transparent;display:block;padding:0}
.foco{position:fixed;border-radius:14px;box-shadow:0 0 0 9999px #0f0e12b8;transition:all .3s cubic-bezier(.2,0,0,1);pointer-events:none;outline:3px solid var(--gold)}
.globo{position:fixed;padding:18px 20px;display:flex;flex-direction:column;gap:6px;animation:anZoom .25s cubic-bezier(.2,0,0,1);z-index:41}
.globo small{color:var(--tertiary);font-weight:600}
.globo h3{font:400 1.7rem var(--serif);color:var(--c);margin:0}
.globo p{margin:0;color:var(--on-s-var)}
.globo .botones{justify-content:flex-end;margin-top:6px}
.host.con-fondo{background-size:cover;background-attachment:fixed}
.host.con-fondo .top{background:#FDF8FFEB;backdrop-filter:blur(8px)}
.host.con-fondo .stage{background:#FDF8FFE6;border-radius:28px;margin:18px auto;width:calc(100% - 48px);box-shadow:0 10px 40px #0004;backdrop-filter:blur(6px)}

@media (min-width:1150px){
  #form.ancho-diapo{max-width:none}

function teclasDiapositiva(e) {

/* ---------- Archivo / almacenamiento ---------- */
const LS = 'quiziglesia.quiz';
let quiz = (() => { try { const q = JSON.parse(localStorage.getItem(LS)); return q && q.items ? normalizarQuiz(q) : ejemploQuiz(); } catch (e) { return ejemploQuiz(); } })();
/* El quiz se guarda en IndexedDB (mucho más espacio que localStorage, que queda solo como respaldo). */
const IDB = {
  db: null,
  abrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, mal) => {
      const r = indexedDB.open('quiziglesia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('datos');
      r.onsuccess = () => ok(this.db = r.result); r.onerror = () => mal(r.error);
    });
  },
  get(k) { return this.abrir().then(db => new Promise((ok, mal) => { const q = db.transaction('datos').objectStore('datos').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => mal(q.error); })); },
  set(k, v) { return this.abrir().then(db => new Promise((ok, mal) => { const tx = db.transaction('datos', 'readwrite'); tx.objectStore('datos').put(v, k); tx.oncomplete = () => ok(); tx.onerror = tx.onabort = () => mal(tx.error); })); },
  del(k) { return this.abrir().then(db => new Promise((ok, mal) => { const tx = db.transaction('datos', 'readwrite'); tx.objectStore('datos').delete(k); tx.oncomplete = () => ok(); tx.onerror = tx.onabort = () => mal(tx.error); })); },
};
/* "Mis quizzes": cada quiz se guarda aparte (q:<id>) y el índice lista título, cantidad y fecha. */
let INDICE = [];
function entradaIndice(q) { return { id: q.id, titulo: q.config.titulo || 'Sin título', n: q.items.length, np: q.items.filter(esPregunta).length, fecha: Date.now() }; }
function guardarEnIndice(q, s) {
  const e = entradaIndice(q), i = INDICE.findIndex(x => x.id === q.id);
  if (i >= 0) INDICE[i] = e; else INDICE.push(e);
  return Promise.all([IDB.set('q:' + q.id, s || JSON.stringify(q)), IDB.set('indice', INDICE)]);
}
function cambiarQuiz(q) { // abrir otro quiz como actual (el anterior ya quedó guardado en la lista)
  if (tGuardar) guardarAhora();
  quiz = normalizarQuiz(q); edSel = 0; sItem = null; sSel = null;
  HIST.pila = []; HIST.pos = -1;
  return guardarAhora();
}
let tGuardar = null, errorGuardadoAvisado = false;
function guardarLocal() { estadoGuardado('guardando'); clearTimeout(tGuardar); tGuardar = setTimeout(guardarAhora, 400); }
function guardarAhora() {
  clearTimeout(tGuardar); tGuardar = null;
  const s = JSON.stringify(quiz);
  registrarHistorial(s);
  return IDB.set('actual', s).then(() => guardarEnIndice(quiz, s)).then(() => { estadoGuardado('ok'); try { localStorage.removeItem(LS); } catch (_) { } })
    .catch(e => { console.warn(e); try { localStorage.setItem(LS, s); estadoGuardado('ok'); } catch (_) { estadoGuardado('error'); } });
}
document.addEventListener('visibilitychange', () => { if (document.hidden && tGuardar) guardarAhora(); });
function estadoGuardado(st) {
  const el = $('#guardado');
  if (el) { el.className = 'guardado ' + st; el.innerHTML = st === 'error' ? `${ic('error')}<span class="lbl">No se pudo guardar</span>` : st === 'ok' ? `${ic('cloud_done')}<span class="lbl">Guardado</span>` : `${ic('sync')}<span class="lbl">Guardando…</span>`; }
  if (st === 'error' && !errorGuardadoAvisado) { errorGuardadoAvisado = true; aviso('⚠️ No se pudo guardar en este navegador. Descarga el archivo con 💾 para no perder cambios.', 8000); }
}
function aviso(msg, ms = 2200) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'ver'; clearTimeout(t._t); t._t = setTimeout(() => t.className = '', ms);
}
const HIST = { pila: [], pos: -1 };
function registrarHistorial(s) {
  if (HIST.pila[HIST.pos] === s) return;
  HIST.pila = HIST.pila.slice(0, HIST.pos + 1); HIST.pila.push(s);
  if (HIST.pila.length > 60) HIST.pila.shift();
  HIST.pos = HIST.pila.length - 1; botonesHistorial();
}
function botonesHistorial() { const u = $('#bUndo'), r = $('#bRedo'); if (u) u.disabled = HIST.pos <= 0; if (r) r.disabled = HIST.pos >= HIST.pila.length - 1; }
function moverHistorial(d) {
  if (tGuardar) guardarAhora();
  const j = HIST.pos + d; if (j < 0 || j >= HIST.pila.length) return;
  HIST.pos = j; quiz = JSON.parse(HIST.pila[j]);
  IDB.set('actual', HIST.pila[j]).then(() => estadoGuardado('ok')).catch(() => estadoGuardado('error'));
  if (edSel >= quiz.items.length) edSel = quiz.items.length - 1;
  sSel = null; sEdit = false; sItem = null;
  const t = $('#qTitulo'); if (t) t.value = quiz.config.titulo;
  if ($('#lista')) { renderLista(); renderForm(); }
  botonesHistorial(); aviso(d < 0 ? '↶ Deshecho' : '↷ Rehecho', 1200);
}

const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const SND = {
  ctx: null, master: null, musica: null,
  silencio: (() => { try { return localStorage.getItem('quiziglesia.silencio') === '1'; } catch (_) { return false; } })(),
  init() {

  alternar() { this.silencio = !this.silencio; try { localStorage.setItem('quiziglesia.silencio', this.silencio ? '1' : '0'); } catch (_) { } if (this.master) this.master.gain.value = this.silencio ? 0 : 0.7; },

    for (let i = 0; i < n; i++) ch[i] = Math.random() * 2 - 1;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = o.filtro || 'highpass'; f.frequency.setValueAtTime(o.fq || 6000, t); if (o.fq2) f.frequency.exponentialRampToValueAtTime(o.fq2, t + d);

      case 'tic': N(96, 0, 0.07, { tipo: 'square', vol: 0.05 }); break;

      const img = new Image();

        const s = Math.min(1, max / Math.max(img.width, img.height));

/* ---------- Utilidades de juego ---------- */

const textoVersiculo = it => palabrasVersiculo(it).join(' ');

function lineaDe(it) { // hechos fijos (en orden) + el hecho que hay que ubicar y su posición correcta
  const v = opcionesValidas(it.elementos || []);
  let u = v.findIndex(x => x.i === +it.ubicar); if (u < 0) u = 0;
  return { hecho: v[u] ? v[u].o : '', fijos: v.filter((_, k) => k !== u).map(x => x.o), pos: u };

const palabrasHuecos = it => String(it.palabras || '').split(',').map(x => x.trim()).filter(Boolean);
const nHuecos = it => (String(it.frase || '').match(/_{3,}/g) || []).length;
const afirmValidas = it => (it.afirmaciones || []).filter(a => String(a.t).trim());

function fraccion(it, v) {
  try {
    switch (it.tipo) {
      case 'alternativas': case 'emoji': case 'revela': case 'zoom': case 'audio': return it.correctas.includes(Number(v)) ? 1 : 0;
      case 'vf': return v === it.correcta ? 1 : 0;
      case 'completar': case 'quiensoy': return aceptadas(it).includes(norm(v)) ? 1 : 0;
      case 'pin': { const dx = v.x - it.x, dy = (v.y - it.y) * (it.ar || 1); return Math.hypot(dx, dy) <= it.radio ? 1 : 0; }

    switch (it.tipo) {
      case 'error': if (tokensError(it).idx < 0) m('falta marcar la palabra equivocada con *asteriscos*'); break;
      case 'parejas': if (paresValidos(it).length < 2) m('necesita al menos 2 parejas completas'); break;
      case 'versiculo': if (palabrasVersiculo(it).length < 2) m('falta el versículo'); break;
      case 'quiensoy': if (!pistasValidas(it).length || !aceptadas(it).length) m('faltan pistas o respuestas aceptadas'); break;
      case 'revela': if (!it.imagen) m('falta la imagen'); break;
      case 'clasificar': if (!clasifValidos(it).length) m('no tiene elementos'); break;
      case 'linea': if (opcionesValidas(it.elementos).length < 3) m('necesita al menos 3 hechos'); break;

  switch (it.tipo) {

    case 'quiensoy': return String(it.aceptadas).split(',')[0].trim();
    case 'parejas': return paresValidos(it).map(p => (p.a || '🖼️') + ' → ' + (p.b || '🖼️')).join(' · ');
    case 'versiculo': return textoVersiculo(it) + (it.referencia ? ' (' + it.referencia + ')' : '');
    case 'clasificar': return catsDe(it).map((c, ci) => c + ': ' + clasifValidos(it).filter(e => e.c === ci).map(e => e.t).join(', ')).join(' · ');

const fChk = (l, f, v) => `<label class="chkf"><input type="checkbox" data-f="${f}" ${v ? 'checked' : ''}> ${l}</label>`;
function imgField(it, titulo = 'Imagen (opcional)') {
  return `<div class="fld"><span>${titulo}</span><div class="imgrow">
    <input data-f="imagen" value="${String(it.imagen).startsWith('data:') ? '' : esc(it.imagen)}" placeholder="${String(it.imagen).startsWith('data:') ? 'Imagen subida (guardada dentro del archivo)' : 'Pega la URL de una imagen…'}">
    <button data-a="imgfile">${ic('image')} Elegir</button>${it.imagen ? '<button data-a="imgdel">Quitar</button>' : ''}</div>
    ${it.imagen && !['pin', 'zoom'].includes(it.tipo) ? `<img class="thumb" src="${esc(it.imagen)}">` : ''}</div>`;
}
function listaEditable(it, arr, conColor, conCorrecta, max, ph, conUbicar) {
  const a = it[arr];
  return a.map((o, i) => `<div class="optrow">
      ${conColor ? `<span class="sh" style="background:${COLORES[i % 6]}">${LETRAS[i % 6]}</span>` : `<span class="sh" style="background:var(--outline)">${i + 1}</span>`}
      <input data-arr="${arr}" data-i="${i}" value="${esc(o)}" placeholder="${ph || (conColor ? 'Opción' : 'Elemento')} ${i + 1}">
      ${conCorrecta ? `<button class="chk ${it.correctas.includes(i) ? 'on' : ''}" data-a="corr" data-i="${i}" title="Marcar como correcta">✔</button>` : ''}
      ${conUbicar ? `<button class="ubi ${+it.ubicar === i ? 'on' : ''}" data-a="ubicar" data-i="${i}" title="Este es el que deben ubicar">⭐</button>` : ''}
      ${!conColor ? `<button data-a="optmove" data-arr="${arr}" data-i="${i}" data-d="-1">↑</button><button data-a="optmove" data-arr="${arr}" data-i="${i}" data-d="1">↓</button>` : ''}
      ${a.length > 2 ? `<button data-a="optdel" data-arr="${arr}" data-i="${i}">✕</button>` : ''}</div>`).join('') +
    (a.length < max ? `<button data-a="optadd" data-arr="${arr}">+ Agregar</button>` : '');
}
function renderForm() {
  renderFormCampos();
  const form = $('#form'); if (!objActual()) return;
  const n = quiz.items.length, i = edSel;
  form.insertAdjacentHTML('afterbegin', `<div class="mnav"><button data-a="lista">☰ Lista</button><span class="sp"></span>
    <button data-a="prev" ${i <= -1 ? 'disabled' : ''} aria-label="Anterior">‹</button><span class="pos">${i === -1 ? '⚙️' : `${i + 1} / ${n}`}</span>
    <button data-a="next" ${i >= n - 1 ? 'disabled' : ''} aria-label="Siguiente">›</button></div>`);
  if (i >= 0) form.insertAdjacentHTML('beforeend', `<div class="macts">
    <button data-a="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>↑ Subir</button><button data-a="down" data-i="${i}" ${i === n - 1 ? 'disabled' : ''}>↓ Bajar</button>
    <button data-a="dup" data-i="${i}">⧉ Duplicar</button><button class="peligro" data-a="del" data-i="${i}">✕ Eliminar</button></div>`);
}

/* =================== IMPORTAR POWERPOINT ===================
   - Como elementos editables: se lee el .pptx (zip con XML) con JSZip. Textos, imágenes y formas simples quedan
     editables; gráficos, SmartArt, tablas, líneas y figuras especiales se DIBUJAN como imagen (canvas/SVG) para que
     no se deformen. Opcional: con el PDF exportado del mismo PowerPoint esos elementos se recortan del PDF (idénticos).
   - Como imágenes: PDF exportado (pdf.js) o imágenes JPG/PNG de cada diapositiva.
   - En ambos casos se muestran miniaturas para elegir qué diapositivas importar. */
const LIBS = {
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
};
const cargarScript = url => new Promise((ok, mal) => {
  if ([...document.scripts].some(x => x.src === url && x.dataset.listo)) return ok();
  const sc = document.createElement('script'); sc.src = url; sc.onload = () => { sc.dataset.listo = '1'; ok(); }; sc.onerror = () => mal(new Error('No se pudo descargar una librería necesaria. Revisa tu conexión a internet.'));
  document.head.appendChild(sc);
});
async function abrirPdf(file) {
  await cargarScript(LIBS.pdf); pdfjsLib.GlobalWorkerOptions.workerSrc = LIBS.pdfWorker;
  return pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
}
async function paginaACanvas(pdf, n, ancho) {
  const pg = await pdf.getPage(n), v0 = pg.getViewport({ scale: 1 }), vp = pg.getViewport({ scale: ancho / v0.width });
  const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
  await pg.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return c;
}

}
function topRespuestas(esOk) {

}
function nube() {

}

  const cv = $('#jcanvas'); if (!cv) return;
  P.dib = { color: '#1C1B20', grosor: 10, trazos: [] };
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height]; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); P.dib.trazos.push({ c: P.dib.color, g: P.dib.grosor, p: [pos(e)] }); redibujar(); };
  cv.onpointermove = e => { const t = P.dib.trazos[P.dib.trazos.length - 1]; if (!t || !e.buttons && e.pointerType === 'mouse') return; if (e.pressure === 0 && e.pointerType !== 'mouse') return; t.p.push(pos(e)); redibujar(); };
  cv.onpointerup = () => { };
  redibujar();
}
function redibujar() {
  const cv = $('#jcanvas'); if (!cv) return;
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.lineCap = x.lineJoin = 'round';
  P.dib.trazos.forEach(t => { x.strokeStyle = t.c; x.fillStyle = t.c; x.lineWidth = t.g;
    if (t.p.length === 1) { x.beginPath(); x.arc(t.p[0][0], t.p[0][1], t.g / 2, 0, 7); x.fill(); return; }
    x.beginPath(); x.moveTo(...t.p[0]); t.p.slice(1).forEach(q => x.lineTo(...q)); x.stroke(); });
}
const exportarDibujo = () => { const cv = $('#jcanvas'); return cv ? cv.toDataURL('image/jpeg', 0.7) : ''; };
function overlayPausa() {
  const j = $('.jug'), o = $('#jpausa');
  if (P.pausa && P.q && j && !o) j.insertAdjacentHTML('beforeend', `<div id="jpausa" class="jpausa">${ic('pause_circle', 'fill')}<b>Pausa</b><span>Espera un momento…</span></div>`);
  else if (!P.pausa && o) o.remove();
}
function renderArmado() {
  const q = P.q; if (!q) return;
  $('#jarm').innerHTML = P.armado.length ? P.armado.map((i, k) => `<button data-a="jvq" data-k="${k}">${esc(q.palabras[i])}</button>`).join('') : '<span class="ph">Toca las palabras en orden…</span>';
  $('#jbanco').innerHTML = q.palabras.map((w, i) => P.armado.includes(i) ? '' : `<button data-a="jvp" data-i="${i}">${esc(w)}</button>`).join('');
}
function renderEquipos() {
  clearInterval(P.tInt);
  if (P.eqFijo) return marcoJ(`<div class="estado-big">✅</div><h2>¡Estás dentro!</h2><p class="muted">Tu equipo es:</p>
    <div class="jeq"><button class="on" style="background:${COLORES[P.eq % 6]}">${esc(P.equipos[P.eq] || '')}</button></div><p class="muted">Espera a que comience.</p>`);
  marcoJ(`<div class="estado-big">✅</div><h2>¡Estás dentro!</h2><p class="muted">Elige tu equipo:</p>
    <div class="jeq">${P.equipos.map((n, i) => `<button data-a="jeq" data-i="${i}" class="${P.eq === i ? 'on' : ''}" style="background:${COLORES[i % 6]}">${P.eq === i ? '✔ ' : ''}${esc(n)}</button>`).join('')}</div>
    <p class="muted">Espera a que comience.</p>`);
}
function filasOrden() {
  return P.orden.map((x, k) => `<div><b>${k + 1}</b><span>${esc(x.o)}</span><button data-a="jmov" data-i="${k}" data-d="-1">▲</button><button data-a="jmov" data-i="${k}" data-d="1">▼</button></div>`).join('');
}

iniciar();
</script>
