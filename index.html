<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quiz Iglesia</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f3f1fa;color:#1d1b2b}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:.55em 1em;background:#e6e2f3;color:#1d1b2b;font-weight:600}
button:hover{filter:brightness(.95)}
button.pri{background:var(--c,#6c3ce0);color:#fff}
button.big{font-size:1.25rem;padding:.8em 1.6em}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;padding:.55em .7em;border:2px solid #ddd8ee;border-radius:10px;width:100%;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--c,#6c3ce0)}
input[type=checkbox]{width:auto}
input[type=color]{padding:2px;height:42px;width:80px}
h1,h2,h3{margin:.2em 0}
.sp{flex:1}
/* ---------- Inicio ---------- */
.home{max-width:760px;margin:0 auto;padding:40px 20px;text-align:center}
.home .logo{font-size:64px}
.home .card{background:#fff;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 4px 20px #0001}
.home .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.home .grid button{padding:1em;font-size:1.05rem}
.home .joinrow{display:flex;gap:10px;max-width:360px;margin:10px auto 0}
.muted{color:#6b6880;font-size:.92rem}
/* ---------- Editor ---------- */
.editor{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:#fff;box-shadow:0 2px 10px #0001;z-index:2}
.bar .titulo{max-width:360px;font-weight:700}
.ed-body{flex:1;display:flex;min-height:0}
#lista{width:320px;overflow:auto;background:#faf9fe;border-right:1px solid #e6e2f3;padding:10px}
.li{display:flex;align-items:center;gap:8px;padding:8px;border-radius:10px;cursor:pointer;margin-bottom:4px;background:#fff;border:2px solid transparent}
.li.sel{border-color:var(--c,#6c3ce0)}
.li .n{font-size:.8rem;color:#888;width:18px}
.li .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.li .acts{display:none;gap:2px}
.li:hover .acts,.li.sel .acts{display:flex}
.li .acts button{padding:2px 7px;font-size:.8rem}
.add{margin-top:14px}
.add p{margin:4px 0;font-weight:700;font-size:.9rem}
.add button{display:block;width:100%;text-align:left;margin-bottom:4px;background:#fff;border:1px dashed #cfc8e8}
#form{flex:1;overflow:auto;padding:20px 28px;max-width:900px}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-weight:600;font-size:.9rem;margin-bottom:5px}
.fld.sm{display:inline-block;width:180px;margin-right:12px;vertical-align:top}
.fila{display:flex;flex-wrap:wrap;gap:0 12px}
.fila .fld.sm{flex:0 1 180px;width:auto;margin-right:0}
.fila .fld.ancho{flex-basis:300px}
.mnav,.macts{display:none}
.chkf{display:flex;gap:8px;align-items:center;margin:12px 0;font-weight:600}
.optrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.optrow input{min-width:0}
.optrow .sh{color:#fff;width:38px;height:38px;border-radius:8px;display:grid;place-items:center;flex:none}
.chk{background:#eee;color:#bbb}
.chk.on{background:#26890c;color:#fff}
.imgrow{display:flex;gap:6px}
.imgrow input{flex:1}
.thumb{max-height:160px;max-width:100%;margin-top:8px;border-radius:10px}
.hint{font-size:.85rem;color:#6b6880;margin:4px 0}
.pinprev{position:relative;display:inline-block;max-width:100%;cursor:crosshair;margin-top:8px}
.pinprev img{display:block;max-width:100%;max-height:420px;border-radius:10px}
.pinmark{position:absolute;aspect-ratio:1;border-radius:50%;background:#e21b3c55;border:3px solid #e21b3c;transform:translate(-50%,-50%);pointer-events:none}
.vfbtns{display:flex;gap:10px}
.vfbtns button.on{background:#26890c;color:#fff}
.clb{background:#eee;color:#888;min-width:44px;padding:.5em .5em}
.clb.on{background:var(--cc);color:#fff}
.parrow>span{font-weight:900;color:#888}
.ubi{background:#eee;filter:grayscale(1);opacity:.45}
.ubi.on{background:#ffd93b;filter:none;opacity:1}
.aviso{color:#b0102b;font-weight:600}
/* ---------- Editor en teléfono: lista o formulario, uno a la vez ---------- */
@media (max-width:760px){
  .bar{gap:6px;padding:8px 10px}
  .bar .lbl{display:none}
  .bar button{padding:.55em .7em}
  .bar .titulo{flex:1;min-width:0;max-width:none}
  .bar .sp{display:none}
  .editor.vista-lista #form{display:none}
  .editor.vista-form #lista{display:none}
  #lista{width:100%;border-right:0;padding:10px 12px 24px}
  .li{padding:12px 10px}
  .li .acts,.li:hover .acts,.li.sel .acts{display:none}
  .add .tipos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .add button{margin:0;padding:.8em .6em;font-size:.92rem}
  #form{padding:0 14px 28px;max-width:none}
  .mnav{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:1;background:#f3f1fa;padding:10px 0;margin-bottom:4px;border-bottom:1px solid #e6e2f3}
  .mnav .pos{font-weight:700;color:#6b6880;min-width:56px;text-align:center}
  .mnav button{padding:.55em .9em}
  .macts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px;padding-top:14px;border-top:1px solid #e6e2f3}
  .macts button{padding:.7em .3em;font-size:.88rem}
  .macts .peligro{background:#fde3e7;color:#b0102b}
  .fila .fld.sm,.fila .fld.ancho{flex:1 1 140px}
  .fld.sm{width:100%;margin-right:0}
  .optrow{gap:4px}
  .optrow .sh{width:34px;height:34px}
  .optrow button{padding:.5em .6em}
  .vfbtns button{flex:1;padding:.9em}
  input[type=color]{width:100%}
  .pinprev{display:block}
}
/* ---------- Presentación ---------- */
.host{min-height:100vh;display:flex;flex-direction:column;background:linear-gradient(160deg,var(--c),#1d1b2b);color:#fff}
.host .main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:18px;width:100%}
.hbar{display:flex;gap:10px;align-items:center;padding:12px 18px;background:#0003}
.hbar button{background:#ffffff22;color:#fff}
.hbar button.pri{background:#fff;color:#1d1b2b}
.pill{background:#ffffff22;border-radius:30px;padding:6px 14px;font-weight:700}
.join{display:flex;gap:30px;align-items:center;background:#fff;color:#1d1b2b;border-radius:20px;padding:24px 34px;flex-wrap:wrap;justify-content:center}
.join .qr svg{width:220px;height:220px;display:block}
.join .code{font-size:4rem;font-weight:900;letter-spacing:.12em;color:var(--c)}
.join .url{font-weight:700;word-break:break-all;max-width:380px}
.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.chip{background:#fff;color:#1d1b2b;border-radius:30px;padding:8px 16px;font-weight:700;font-size:1.1rem;cursor:pointer}
.chip.off{opacity:.45}
.chip:hover{text-decoration:line-through}
.warn{background:#ffd93b;color:#1d1b2b;border-radius:12px;padding:10px 16px;font-weight:600;max-width:720px}
.slide h1{font-size:clamp(2rem,6vw,4.5rem)}
.slide p{font-size:clamp(1.2rem,3vw,2.2rem);max-width:1100px;white-space:pre-wrap;margin:0}
.slide img,.qimg{max-height:45vh;max-width:90%;border-radius:16px;box-shadow:0 10px 40px #0005}
.hq-top{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1200px;font-weight:700}
.timer{width:84px;height:84px;border-radius:50%;background:#fff;color:#1d1b2b;display:grid;place-items:center;font-size:2.2rem;font-weight:900}
.hq-q{font-size:clamp(1.5rem,4vw,3rem);background:#fff;color:#1d1b2b;border-radius:16px;padding:16px 28px;max-width:1200px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:1200px}
.opt{display:flex;align-items:center;gap:14px;border-radius:14px;padding:18px 22px;font-size:clamp(1.1rem,2.6vw,2rem);font-weight:700;text-align:left;position:relative;overflow:hidden;min-height:90px}
.opt .f{font-size:1.4em}
.opt .cnt{margin-left:auto;font-size:1.1em}
.opt.dim{opacity:.3}
.opt .barra{position:absolute;left:0;bottom:0;height:8px;background:#fff9}
.frase{font-size:clamp(1.4rem,4vw,3rem);font-weight:700;max-width:1100px}
.blank{display:inline-block;min-width:4ch;border-bottom:5px solid #fff;color:#ffd93b}
.lista-ord{display:flex;flex-direction:column;gap:10px;min-width:min(700px,90vw)}
.lista-ord div{background:#fff;color:#1d1b2b;border-radius:12px;padding:12px 18px;font-size:1.5rem;font-weight:700;text-align:left}
.lista-ord b{color:var(--c);margin-right:10px}
.pinhost{position:relative;display:inline-block}
.pinhost img{display:block;max-height:58vh;max-width:90vw;border-radius:14px}
.pinhost .tgt{position:absolute;aspect-ratio:1;border-radius:50%;border:4px solid #26890c;background:#26890c44;transform:translate(-50%,-50%)}
.pinhost .pp{position:absolute;transform:translate(-50%,-100%);font-size:1.7rem;filter:drop-shadow(0 2px 2px #0008)}
.linea{position:relative;width:min(1000px,90vw);height:120px;margin-top:20px}
.linea .eje{position:absolute;left:0;right:0;top:60px;height:6px;background:#fff;border-radius:3px}
.linea .d{position:absolute;top:22px;transform:translateX(-50%);font-size:1.6rem}
.linea .ok{position:absolute;top:40px;transform:translateX(-50%);width:6px;height:46px;background:#26890c;border-radius:3px}
.linea .okl{position:absolute;top:92px;transform:translateX(-50%);font-weight:900;font-size:1.4rem}
.linea .mm{position:absolute;top:92px;font-weight:700}
.nube{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center;max-width:1100px}
.nube span{font-weight:800;line-height:1.1}
.tops{display:flex;flex-direction:column;gap:6px;min-width:min(520px,90vw)}
.tops div{display:flex;justify-content:space-between;background:#ffffff22;padding:8px 14px;border-radius:10px;font-size:1.2rem}
.rank{display:flex;flex-direction:column;gap:10px;width:min(900px,92vw)}
.rk{display:flex;align-items:center;gap:12px;background:#fff;color:#1d1b2b;border-radius:12px;padding:10px 16px;font-size:1.4rem;font-weight:800}
.rk .pos{width:36px;color:var(--c)}
.rk .nm{flex:1;text-align:left}
.rk .plus{font-size:1rem;color:#26890c}
.podio{display:flex;align-items:flex-end;gap:16px}
.podio .col{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:800;font-size:1.3rem}
.podio .blk{width:170px;border-radius:14px 14px 0 0;background:#fff;color:#1d1b2b;display:grid;place-items:center;font-size:2.6rem;font-weight:900}
.podio .av{font-size:3.2rem}
.eqc{display:inline-block;width:22px;height:22px;border-radius:6px;flex:none}
.eqc.big{width:56px;height:56px;border-radius:14px}
/* tipos nuevos (pantalla principal) */
.resumen{font-size:1.4rem;font-weight:700;margin:0}
.emojis{font-size:clamp(3rem,12vw,8rem);line-height:1.15;letter-spacing:.05em}
.revela{position:relative;display:inline-block}
.revela img{display:block;max-height:40vh;max-width:90vw;border-radius:16px}
.tiles{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(4,1fr);border-radius:16px;overflow:hidden}
.tiles i{background:var(--c);border:2px solid #ffffff44;transition:opacity .7s,transform .7s}
.tiles i.off{opacity:0;transform:scale(.5)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.chips span{background:#fff;color:#1d1b2b;border-radius:12px;padding:10px 16px;font-size:clamp(1.1rem,2.4vw,1.8rem);font-weight:700}
.parejas{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px;width:min(1000px,92vw)}
.parejas>div{display:flex;flex-direction:column;gap:10px}
.parejas.sol{grid-template-columns:1fr auto 1fr;align-items:center;gap:10px 16px}
.pz{background:#fff;color:#1d1b2b;border-radius:12px;padding:12px 18px;font-size:clamp(1.1rem,2.4vw,1.7rem);font-weight:700;text-align:left}
.pz.der{background:#ffd93b}
.flecha{font-size:2rem;font-weight:900}
.pistas{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;width:min(900px,92vw);counter-reset:p}
.pistas li{background:#fff;color:#1d1b2b;border-radius:12px;padding:12px 18px;font-size:clamp(1.1rem,2.6vw,1.9rem);font-weight:700;text-align:left;transition:opacity .6s}
.pistas li::before{counter-increment:p;content:"Pista " counter(p) ": ";color:var(--c)}
.pistas li.off{opacity:0}
.cats{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.cat{border-radius:12px;padding:12px 22px;font-size:clamp(1.2rem,2.6vw,1.8rem);font-weight:800}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;width:min(1100px,94vw)}
.col-cat{background:#ffffff22;border-radius:14px;overflow:hidden;text-align:left}
.col-cat h3{margin:0;padding:10px 16px;font-size:1.5rem}
.col-cat div{padding:8px 16px;font-size:1.3rem;font-weight:700;display:flex;justify-content:space-between;gap:10px;border-top:1px solid #ffffff22}
.mal{color:#ff8a9b;text-decoration-thickness:4px}
.bien{color:#b6f5a0;font-weight:900}
.hecho{background:#ffd93b;color:#1d1b2b;border-radius:14px;padding:12px 22px;font-size:clamp(1.3rem,3vw,2.2rem);font-weight:800}
.tl{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;max-width:1200px}
.tl div{background:#fff;color:#1d1b2b;border-radius:12px;padding:10px 16px;font-size:clamp(1rem,2.2vw,1.6rem);font-weight:700}
.tl div.h{background:#ffd93b;outline:4px solid #fff}
.tl i{font-style:normal;font-size:1.6rem;opacity:.7}
.escala{display:flex;gap:18px;align-items:flex-end}
.escala>div{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:1.4rem;font-weight:800}
.escala .eb{width:70px;border-radius:10px 10px 0 0;min-height:6px}
.escala-et{display:flex;justify-content:space-between;gap:40px;font-size:1.4rem;font-weight:700}
.equipos-lobby{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;max-width:1200px}
.eqbox{background:#ffffff18;border-radius:16px;overflow:hidden;min-width:220px;border:3px solid}
.eqbox h3{margin:0;padding:8px 14px}
.eqbox .players{padding:10px}
/* ---------- Jugador ---------- */
.jug{min-height:100vh;display:flex;flex-direction:column;background:var(--bg,#3b2a7a);color:#fff;transition:background .3s}
.jug .top{display:flex;justify-content:space-between;padding:12px 16px;font-weight:700;background:#0002}
.jug .cuerpo{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:16px;gap:14px;text-align:center}
.jug .card{background:#fff;color:#1d1b2b;border-radius:18px;padding:22px;width:100%;max-width:420px}
.avs{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0}
.avs button{font-size:1.6rem;padding:4px;background:#f0edf9}
.avs button.on{background:var(--c,#6c3ce0);outline:3px solid #1d1b2b}
.jopts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;flex:1;max-height:70vh}
.jopts button{color:#fff;font-size:1.15rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:110px}
.jopts button .f{font-size:2.2rem}
.jq{font-size:1.15rem;font-weight:700;background:#0003;border-radius:12px;padding:10px 14px;width:100%}
.jpin{position:relative;width:100%;max-width:600px}
.jpin img{width:100%;display:block;border-radius:12px}
.jpin .m{position:absolute;transform:translate(-50%,-100%);font-size:2.2rem;pointer-events:none}
.jord{display:flex;flex-direction:column;gap:8px;width:100%;max-width:480px}
.jord div{display:flex;align-items:center;gap:8px;background:#fff;color:#1d1b2b;border-radius:10px;padding:8px 10px;font-weight:700;text-align:left}
.jord span{flex:1}
.jord button{padding:6px 12px}
.jnum{font-size:3.2rem;font-weight:900}
.jug input[type=range]{width:100%;max-width:480px}
.estado-big{font-size:5rem}
/* tipos nuevos (teléfono) */
.jemojis{font-size:3.4rem;line-height:1.2}
.jpar{display:flex;flex-direction:column;gap:10px;width:100%;max-width:480px}
.jpar label{display:flex;flex-direction:column;gap:6px;background:#fff;color:#1d1b2b;border-radius:12px;padding:10px;text-align:left;font-weight:700}
.jarm{min-height:64px;width:100%;max-width:520px;background:#fff;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;color:#1d1b2b}
.jarm .ph{color:#888;padding:10px}
.jbanco,.jerr{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:520px}
.jbanco button,.jarm button,.jerr button{font-size:1.1rem;padding:.5em .8em}
.jarm button{background:var(--c,#6c3ce0);color:#fff}
.jerr button.on{background:#ffd93b;outline:3px solid #fff}
.jpistas{list-style:none;padding:0;margin:0;width:100%;max-width:480px;display:flex;flex-direction:column;gap:6px;text-align:left}
.jpistas li{background:#0003;border-radius:10px;padding:8px 12px;font-weight:600}
.jpistas li.off{display:none}
.jclas{display:flex;flex-direction:column;gap:8px;width:100%;max-width:480px}
.jclas>div{background:#fff;color:#1d1b2b;border-radius:12px;padding:8px 10px;text-align:left;font-weight:700}
.jclas>div>div{display:flex;gap:6px;margin-top:6px}
.jclas button{flex:1;font-size:.95rem;padding:.6em .4em;background:#eee}
.jclas button.on{background:var(--cc);color:#fff}
.jlinea{display:flex;flex-direction:column;gap:6px;width:100%;max-width:480px}
.jlinea .fijo{background:#fff;color:#1d1b2b;border-radius:10px;padding:10px 12px;font-weight:700}
.jlinea .slot{background:#ffffff22;color:#fff;border:2px dashed #fff8;padding:.45em}
.jlinea .slot.on{background:#ffd93b;color:#1d1b2b;border-style:solid}
.jescala{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;width:100%;max-width:480px}
.jescala button{color:#fff;font-size:2rem;font-weight:900;min-height:90px;padding:0;min-width:0}
.jescala-et{display:flex;justify-content:space-between;width:100%;max-width:480px;font-weight:700}
.jeq{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.jeq button{color:#fff;font-size:1.3rem;padding:.9em}
.jeq button.on{outline:4px solid #fff;box-shadow:0 0 0 8px #0004}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================
   QUIZ IGLESIA — app tipo Kahoot sin base de datos
   - El quiz se guarda/abre como archivo .json
   - Los teléfonos se conectan por WebRTC (PeerJS), sin servidor propio
   ========================================================= */
const app = document.getElementById('app');
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, '').replace(/\s+/g, ' ').trim();
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const slug = s => norm(s).replace(/ /g, '-');

const COLORES = ['#e21b3c', '#1368ce', '#d89e00', '#26890c', '#864cbf', '#0aa3a3'];
const FORMAS = ['▲', '◆', '●', '■', '★', '⬟'];
const AVATARES = ['🐑','🦁','🐟','🕊️','🐻','🐸','🦊','🐼','🐯','🐧','🦄','🐝','🐢','🐳','🦉','🐨'];

const TIPOS = {

/* ---------- Archivo / almacenamiento ---------- */
const LS = 'quiziglesia.quiz';
let quiz = (() => { try { const q = JSON.parse(localStorage.getItem(LS)); return q && q.items ? normalizarQuiz(q) : ejemploQuiz(); } catch (e) { return ejemploQuiz(); } })();
function guardarLocal() { try { localStorage.setItem(LS, JSON.stringify(quiz)); } catch (e) { console.warn('No se pudo autoguardar (archivo muy grande)'); } }
function bajar(nombre, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function descargarQuiz() { bajar((slug(quiz.config.titulo) || 'quiz') + '.quiz.json', JSON.stringify(quiz, null, 2), 'application/json'); }
function abrirArchivo(cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    f.text().then(t => {
      try { const q = JSON.parse(t); if (!q.items) throw 0; quiz = normalizarQuiz(q); guardarLocal(); cb && cb(); }
      catch (e) { alert('El archivo no es un quiz válido.'); }
    });
  };
  i.click();
}
function leerImagen(cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      if (f.type === 'image/svg+xml' || f.type === 'image/gif') return cb(r.result);
      const img = new Image();
      img.onload = () => { // reducir para que el archivo no pese demasiado
        const max = 1200, s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  i.click();
}

/* ---------- Utilidades de juego ---------- */
const tiempoDe = it => Number(it.tiempo) || Number(quiz.config.tiempo) || 20;
const aceptadas = it => String(it.aceptadas || '').split(',').map(norm).filter(Boolean);
const opcionesValidas = arr => arr.map((o, i) => ({ o, i })).filter(x => String(x.o).trim());
const esPregunta = it => it.tipo !== 'diapositiva';
const paresValidos = it => (it.pares || []).filter(p => String(p.a).trim() && String(p.b).trim());
const clasifValidos = it => (it.elementos || []).map((e, i) => ({ t: e.t, c: +e.c || 0, i })).filter(e => String(e.t).trim());
const catsDe = it => (it.categorias || []).map((c, i) => String(c).trim() || 'Grupo ' + (i + 1));
const pistasValidas = it => (it.pistas || []).filter(x => String(x).trim());
const abrev = c => ((String(c).match(/\p{Lu}/gu) || []).join('') || String(c).trim().slice(0, 2)).slice(0, 3);
function palabrasVersiculo(it) { // si el texto tiene "/", se corta en esos trozos; si no, palabra por palabra
  const t = String(it.texto || '').trim();
  return (t.includes('/') ? t.split('/') : t.split(/\s+/)).map(x => x.trim()).filter(Boolean);
}
const textoVersiculo = it => palabrasVersiculo(it).join(' ');
function tokensError(it) { // la palabra equivocada va entre *asteriscos*
  const tk = String(it.texto || '').trim().split(/\s+/).filter(Boolean);
  const idx = tk.findIndex(w => /\*[^*]+\*/.test(w)), m = idx >= 0 ? tk[idx].match(/^(.*)\*([^*]+)\*(.*)$/) : null;
  return { tokens: tk.map(w => w.replace(/\*/g, '')), idx, antes: m ? m[1] : '', palabra: m ? m[2] : '', despues: m ? m[3] : '' };
}
function lineaDe(it) { // hechos fijos (en orden) + el hecho que hay que ubicar y su posición correcta
  const v = opcionesValidas(it.elementos || []);
  let u = v.findIndex(x => x.i === +it.ubicar); if (u < 0) u = 0;
  return { hecho: v[u] ? v[u].o : '', fijos: v.filter((_, k) => k !== u).map(x => x.o), pos: u };
}
const pistasVisibles = (n, ms, T) => n ? Math.min(n, 1 + Math.floor(Math.max(0, ms) / (T / n))) : 0;
// Fracción correcta de una respuesta (0 a 1). La mayoría es todo o nada; parejas y clasificar dan puntaje parcial.
function fraccion(it, v) {
  try {
    switch (it.tipo) {
      case 'alternativas': case 'emoji': case 'revela': return it.correctas.includes(Number(v)) ? 1 : 0;
      case 'vf': return v === it.correcta ? 1 : 0;
      case 'completar': case 'quiensoy': return aceptadas(it).includes(norm(v)) ? 1 : 0;
      case 'pin': { const dx = v.x - it.x, dy = (v.y - it.y) * (it.ar || 1); return Math.hypot(dx, dy) <= it.radio ? 1 : 0; }
      case 'ordenar': { const ok = opcionesValidas(it.elementos).map(x => x.i); return Array.isArray(v) && v.length === ok.length && v.every((x, k) => x === ok[k]) ? 1 : 0; }
      case 'numero': return Math.abs(Number(v) - Number(it.correcta)) <= Number(it.tolerancia || 0) ? 1 : 0;
      case 'parejas': { const n = paresValidos(it).length; return Array.isArray(v) && n ? v.slice(0, n).filter((x, k) => Number(x) === k).length / n : 0; }
      case 'versiculo': return Array.isArray(v) && norm(v.join(' ')) === norm(textoVersiculo(it)) ? 1 : 0;
      case 'clasificar': {
        const el = clasifValidos(it); if (!Array.isArray(v) || !el.length) return 0;
        const m = new Map(v.map(p => [Number(p[0]), Number(p[1])]));
        return el.filter(e => m.get(e.i) === e.c).length / el.length;
      }
      case 'error': return Number(v) === tokensError(it).idx ? 1 : 0;
      case 'linea': return Number(v) === lineaDe(it).pos ? 1 : 0;
    }
  } catch (e) { }
  return 0;
}
const evaluar = (it, v) => fraccion(it, v) >= 1;
function problemasQuiz() {
  const pr = [];
  quiz.items.forEach((it, i) => {
    const m = t => pr.push(`${i + 1}. ${TIPOS[it.tipo].nombre}: ${t}`);
    switch (it.tipo) {
      case 'error': if (tokensError(it).idx < 0) m('falta marcar la palabra equivocada con *asteriscos*'); break;
      case 'parejas': if (paresValidos(it).length < 2) m('necesita al menos 2 parejas completas'); break;
      case 'versiculo': if (palabrasVersiculo(it).length < 2) m('falta el versículo'); break;
      case 'quiensoy': if (!pistasValidas(it).length || !aceptadas(it).length) m('faltan pistas o respuestas aceptadas'); break;
      case 'revela': if (!it.imagen) m('falta la imagen'); break;
      case 'clasificar': if (!clasifValidos(it).length) m('no tiene elementos'); break;
      case 'linea': if (opcionesValidas(it.elementos).length < 3) m('necesita al menos 3 hechos'); break;
      case 'emoji': if (!String(it.emojis || '').trim()) m('faltan los emojis'); break;
    }
  });
  return pr;
}
function textoCorrecta(it) {
  switch (it.tipo) {
    case 'alternativas': case 'emoji': case 'revela': return it.correctas.map(i => it.opciones[i]).join(' / ');
    case 'quiensoy': return String(it.aceptadas).split(',')[0].trim();
    case 'parejas': return paresValidos(it).map(p => p.a + ' → ' + p.b).join(' · ');
    case 'versiculo': return textoVersiculo(it) + (it.referencia ? ' (' + it.referencia + ')' : '');
    case 'clasificar': return catsDe(it).map((c, ci) => c + ': ' + clasifValidos(it).filter(e => e.c === ci).map(e => e.t).join(', ')).join(' · ');
    case 'error': { const t = tokensError(it); return `«${t.palabra}»` + (it.correctaTxt ? ` debía decir «${it.correctaTxt}»` : ''); }
    case 'linea': { const l = lineaDe(it); return l.pos === 0 ? 'Antes de: ' + l.fijos[0] : 'Después de: ' + l.fijos[l.pos - 1]; }
    case 'vf': return it.correcta ? 'Verdadero' : 'Falso';
    case 'completar': return String(it.aceptadas).split(',')[0].trim();
    case 'pin': return '📍 Mira la pantalla';
    case 'ordenar': return opcionesValidas(it.elementos).map(x => x.o).join(' → ');
    case 'numero': return it.correcta + (it.unidad ? ' ' + it.unidad : '');
  }
  return '';
}

let edSel = 0;
let edVista = 'lista'; // en teléfono: 'lista' o 'form' (en computador se ven ambas)
function verVista(v) {
  edVista = v;
  const ed = $('.editor'); if (!ed) return;
  ed.classList.toggle('vista-lista', v === 'lista'); ed.classList.toggle('vista-form', v === 'form');
  if (v === 'form') $('#form').scrollTop = 0;
  else { const s = $('#lista .li.sel'); if (s) s.scrollIntoView({ block: 'center' }); }
}
function etiqueta(it) { return it.tipo === 'diapositiva' ? (it.titulo || '(diapositiva sin título)') : (it.pregunta || '(pregunta sin texto)'); }
function objActual() { return edSel === -1 ? quiz.config : quiz.items[edSel]; }

function vistaEditor() {
  if (edSel >= quiz.items.length) edSel = quiz.items.length - 1;
  app.innerHTML = `<div class="editor vista-${edVista}" style="--c:${esc(quiz.config.color)}">
    <header class="bar"><button data-a="home" title="Inicio">⬅<span class="lbl"> Inicio</span></button>
      <input class="titulo" id="qTitulo" value="${esc(quiz.config.titulo)}" aria-label="Título del quiz">
      <span class="sp"></span>
      <button data-a="abrir" title="Abrir archivo">📂<span class="lbl"> Abrir</span></button><button data-a="guardar" title="Guardar archivo">💾<span class="lbl"> Guardar archivo</span></button>
      <button class="pri" data-a="presentar" title="Presentar">▶<span class="lbl"> Presentar</span></button></header>
    <div class="ed-body"><aside id="lista"></aside><main id="form"></main></div></div>`;
  $('#qTitulo').oninput = e => { quiz.config.titulo = e.target.value; guardarLocal(); };
  const form = $('#form');
  form.oninput = e => {
    const el = e.target, it = objActual(); if (!it) return;
    if (el.dataset.f) {
      let v = el.type === 'checkbox' ? el.checked : el.value;
      if ('num' in el.dataset) v = el.value === '' ? null : Number(el.value);
      it[el.dataset.f] = v;
      if (el.dataset.f === 'radio') actualizarPinMark();
      if (el.dataset.f === 'color') app.firstChild.style.setProperty('--c', v);
    } else if (el.dataset.arr) it[el.dataset.arr][+el.dataset.i] = el.value;
    else if (el.dataset.par != null) it.pares[+el.dataset.par][el.dataset.lado] = el.value;
    else if (el.dataset.cl != null) it.elementos[+el.dataset.cl].t = el.value;
    if (it.tipo === 'error') { const a = $('#avisoErr'); if (a) a.hidden = tokensError(it).idx >= 0; }
    guardarLocal(); renderLista();
  };
  form.onchange = e => { if (e.target.dataset.f === 'imagen') renderForm(); };
  ACC = {
    home: vistaInicio, guardar: descargarQuiz, presentar: () => vistaPresentar(),
    abrir: () => abrirArchivo(() => { edSel = 0; vistaEditor(); }),
    sel: el => { edSel = +el.dataset.i; renderLista(); renderForm(); verVista('form'); },
    add: el => { const i = edSel + 1; quiz.items.splice(i, 0, nuevoItem(el.dataset.t)); edSel = i; guardarLocal(); renderLista(); renderForm(); verVista('form'); },
    lista: () => verVista('lista'),
    prev: () => { if (edSel > -1) { edSel--; renderLista(); renderForm(); $('#form').scrollTop = 0; } },
    next: () => { if (edSel < quiz.items.length - 1) { edSel++; renderLista(); renderForm(); $('#form').scrollTop = 0; } },
    up: el => mover(+el.dataset.i, -1), down: el => mover(+el.dataset.i, 1),
    dup: el => { const i = +el.dataset.i; quiz.items.splice(i + 1, 0, JSON.parse(JSON.stringify(quiz.items[i]))); edSel = i + 1; guardarLocal(); renderLista(); renderForm(); },
    del: el => { const i = +el.dataset.i; if (!confirm('¿Eliminar este elemento?')) return; quiz.items.splice(i, 1); edSel = Math.min(i, quiz.items.length - 1); guardarLocal(); renderLista(); renderForm(); verVista('lista'); },
    optadd: el => { objActual()[el.dataset.arr].push(''); guardarLocal(); renderForm(); },
    optdel: el => {
      const it = objActual(), i = +el.dataset.i; it[el.dataset.arr].splice(i, 1);
      if (it.correctas && el.dataset.arr === 'opciones') { it.correctas = it.correctas.filter(c => c !== i).map(c => c > i ? c - 1 : c); if (!it.correctas.length) it.correctas = [0]; }
      if (el.dataset.arr === 'categorias') it.elementos.forEach(e => { if (+e.c === i) e.c = 0; else if (+e.c > i) e.c = +e.c - 1; });
      if (el.dataset.arr === 'elementos' && it.ubicar != null) { if (it.ubicar === i) it.ubicar = 0; else if (it.ubicar > i) it.ubicar--; }
      guardarLocal(); renderForm();
    },
    optmove: el => {
      const it = objActual(), a = it[el.dataset.arr], i = +el.dataset.i, j = i + (+el.dataset.d); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]];
      if (el.dataset.arr === 'elementos' && it.ubicar != null) { if (it.ubicar === i) it.ubicar = j; else if (it.ubicar === j) it.ubicar = i; }
      guardarLocal(); renderForm();
    },
    paradd: () => { objActual().pares.push({ a: '', b: '' }); guardarLocal(); renderForm(); },
    pardel: el => { objActual().pares.splice(+el.dataset.i, 1); guardarLocal(); renderForm(); },
    cladd: () => { objActual().elementos.push({ t: '', c: 0 }); guardarLocal(); renderForm(); },
    cldel: el => { objActual().elementos.splice(+el.dataset.i, 1); guardarLocal(); renderForm(); },
    clcat: el => { objActual().elementos[+el.dataset.i].c = +el.dataset.c; guardarLocal(); renderForm(); },
    ubicar: el => { objActual().ubicar = +el.dataset.i; guardarLocal(); renderForm(); },
    corr: el => { const it = objActual(), i = +el.dataset.i; it.correctas = it.correctas.includes(i) ? it.correctas.filter(c => c !== i) : [...it.correctas, i]; if (!it.correctas.length) it.correctas = [i]; guardarLocal(); renderForm(); },
    vf: el => { objActual().correcta = el.dataset.v === 'true'; guardarLocal(); renderForm(); },
    imgfile: () => leerImagen(d => { objActual().imagen = d; guardarLocal(); renderForm(); }),
    imgdel: () => { objActual().imagen = ''; guardarLocal(); renderForm(); },
    pinset: (el, e) => {
      const r = el.getBoundingClientRect(), it = objActual();
      it.x = +((e.clientX - r.left) / r.width * 100).toFixed(1); it.y = +((e.clientY - r.top) / r.height * 100).toFixed(1);
      guardarLocal(); actualizarPinMark();
    },
  };
  renderLista(); renderForm();
}
function mover(i, d) { const j = i + d; if (j < 0 || j >= quiz.items.length) return; [quiz.items[i], quiz.items[j]] = [quiz.items[j], quiz.items[i]]; edSel = j; guardarLocal(); renderLista(); renderForm(); }
function renderLista() {
  $('#lista').innerHTML = `<div class="li ${edSel === -1 ? 'sel' : ''}" data-a="sel" data-i="-1">⚙️ <b>Configuración</b></div>` +
    quiz.items.map((it, i) => `<div class="li ${edSel === i ? 'sel' : ''}" data-a="sel" data-i="${i}"><span class="n">${i + 1}</span><span>${TIPOS[it.tipo].icono}</span><span class="tx">${esc(etiqueta(it))}</span>
      <span class="acts"><button data-a="up" data-i="${i}" title="Subir">↑</button><button data-a="down" data-i="${i}" title="Bajar">↓</button><button data-a="dup" data-i="${i}" title="Duplicar">⧉</button><button data-a="del" data-i="${i}" title="Eliminar">✕</button></span></div>`).join('') +
    `<div class="add"><p>➕ Agregar después del seleccionado:</p><div class="tipos">${Object.entries(TIPOS).map(([k, t]) => `<button data-a="add" data-t="${k}">${t.icono} ${t.nombre}</button>`).join('')}</div></div>`;
}
const fTxt = (l, f, v, ph = '') => `<label class="fld"><span>${l}</span><input data-f="${f}" value="${esc(v)}" placeholder="${esc(ph)}"></label>`;
const fArea = (l, f, v, ph = '') => `<label class="fld"><span>${l}</span><textarea data-f="${f}" rows="3" placeholder="${esc(ph)}">${esc(v)}</textarea></label>`;
const fNum = (l, f, v, ph = '') => `<label class="fld sm"><span>${l}</span><input type="number" data-f="${f}" data-num value="${v ?? ''}" placeholder="${esc(ph)}"></label>`;
const fChk = (l, f, v) => `<label class="chkf"><input type="checkbox" data-f="${f}" ${v ? 'checked' : ''}> ${l}</label>`;
function imgField(it, titulo = 'Imagen (opcional)') {
  return `<div class="fld"><span>${titulo}</span><div class="imgrow">
    <input data-f="imagen" value="${String(it.imagen).startsWith('data:') ? '' : esc(it.imagen)}" placeholder="${String(it.imagen).startsWith('data:') ? 'Imagen subida (guardada dentro del archivo)' : 'Pega la URL de una imagen…'}">
    <button data-a="imgfile">📁 Subir</button>${it.imagen ? '<button data-a="imgdel">Quitar</button>' : ''}</div>
    ${it.imagen && it.tipo !== 'pin' ? `<img class="thumb" src="${esc(it.imagen)}">` : ''}</div>`;
}
function listaEditable(it, arr, conColor, conCorrecta, max, ph, conUbicar) {
  const a = it[arr];
  return a.map((o, i) => `<div class="optrow">
      ${conColor ? `<span class="sh" style="background:${COLORES[i % 6]}">${FORMAS[i % 6]}</span>` : `<span class="sh" style="background:#888">${i + 1}</span>`}
      <input data-arr="${arr}" data-i="${i}" value="${esc(o)}" placeholder="${ph || (conColor ? 'Opción' : 'Elemento')} ${i + 1}">
      ${conCorrecta ? `<button class="chk ${it.correctas.includes(i) ? 'on' : ''}" data-a="corr" data-i="${i}" title="Marcar como correcta">✔</button>` : ''}
      ${conUbicar ? `<button class="ubi ${+it.ubicar === i ? 'on' : ''}" data-a="ubicar" data-i="${i}" title="Este es el que deben ubicar">⭐</button>` : ''}
      ${!conColor ? `<button data-a="optmove" data-arr="${arr}" data-i="${i}" data-d="-1">↑</button><button data-a="optmove" data-arr="${arr}" data-i="${i}" data-d="1">↓</button>` : ''}
      ${a.length > 2 ? `<button data-a="optdel" data-arr="${arr}" data-i="${i}">✕</button>` : ''}</div>`).join('') +
    (a.length < max ? `<button data-a="optadd" data-arr="${arr}">+ Agregar</button>` : '');
}
function renderForm() {
  renderFormCampos();
  const form = $('#form'); if (!objActual()) return;
  const n = quiz.items.length, i = edSel;
  form.insertAdjacentHTML('afterbegin', `<div class="mnav"><button data-a="lista">☰ Lista</button><span class="sp"></span>
    <button data-a="prev" ${i <= -1 ? 'disabled' : ''} aria-label="Anterior">‹</button><span class="pos">${i === -1 ? '⚙️' : `${i + 1} / ${n}`}</span>
    <button data-a="next" ${i >= n - 1 ? 'disabled' : ''} aria-label="Siguiente">›</button></div>`);
  if (i >= 0) form.insertAdjacentHTML('beforeend', `<div class="macts">
    <button data-a="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>↑ Subir</button><button data-a="down" data-i="${i}" ${i === n - 1 ? 'disabled' : ''}>↓ Bajar</button>
    <button data-a="dup" data-i="${i}">⧉ Duplicar</button><button class="peligro" data-a="del" data-i="${i}">✕ Eliminar</button></div>`);
}
function renderFormCampos() {
  const form = $('#form'), it = objActual();

    const c = quiz.config;
    form.innerHTML = `<h2>⚙️ Configuración del quiz</h2>
      ${fTxt('Título', 'titulo', c.titulo)}${fTxt('Iglesia / grupo (opcional)', 'organizacion', c.organizacion)}
      <div class="fila"><label class="fld sm"><span>Color principal</span><input type="color" data-f="color" value="${esc(c.color)}"></label>
      ${fNum('Tiempo por pregunta (seg)', 'tiempo', c.tiempo)}${fNum('Puntos por respuesta correcta', 'puntos', c.puntos)}</div>
      ${fChk('Dar más puntos a quien responde más rápido', 'bonusVelocidad', c.bonusVelocidad)}

        ${[[1, 'Después de cada pregunta'], [2, 'Cada 2 preguntas'], [3, 'Cada 3 preguntas'], [5, 'Cada 5 preguntas'], [0, 'Solo al final']].map(([v, t]) => `<option value="${v}" ${+c.rankingCada === v ? 'selected' : ''}>${t}</option>`).join('')}
      </select></label></div>
      ${fChk('Mostrar la respuesta correcta en el teléfono', 'mostrarCorrectaTelefono', c.mostrarCorrectaTelefono)}
      ${fChk('Permitir unirse después de comenzar', 'permitirTarde', c.permitirTarde)}
      ${fChk('Jugar por equipos (el puntaje se suma por equipo)', 'modoEquipos', c.modoEquipos)}
      ${fTxt('Nombres de los equipos (separados por coma, de 2 a 6)', 'nombresEquipos', c.nombresEquipos)}
      <p class="hint">Con equipos, cada participante elige su equipo al entrar. Sirve también con un solo teléfono por equipo.</p>
      <p class="hint">Todo se guarda automáticamente en este navegador. Para conservarlo o pasarlo a otro computador usa <b>💾 Guardar archivo</b>.</p>`;
    return;
  }
  const T = TIPOS[it.tipo];
  let h = `<h2>${T.icono} ${T.nombre}</h2>`;
  if (it.tipo === 'diapositiva') {

  }
  h += fArea('Pregunta', 'pregunta', it.pregunta);

  switch (it.tipo) {
    case 'alternativas': h += opcAlt(); break;
    case 'emoji': h += fTxt('Emojis de la historia', 'emojis', it.emojis, '🐋👨‍🦰🌊') + '<p class="hint">Se muestran en grande en la pantalla. En el teléfono puedes usar el teclado de emojis.</p>' + opcAlt(); break;
    case 'revela': h += imgField(it, 'Imagen a revelar') + '<p class="hint">La imagen empieza tapada y se va destapando de a poco. Quien responde antes gana más puntos.</p>' + opcAlt(); break;
    case 'parejas':
      h += `<div class="fld"><span>Parejas correctas (la columna derecha se mezcla al jugar)</span>${it.pares.map((p, k) => `<div class="optrow parrow">
        <input data-par="${k}" data-lado="a" value="${esc(p.a)}" placeholder="${['Noé', 'David', 'Daniel', 'Moisés', 'Jonás', 'Pedro'][k] || 'Izquierda'}"><span>↔</span>
        <input data-par="${k}" data-lado="b" value="${esc(p.b)}" placeholder="${['El arca', 'Goliat', 'Los leones', 'El mar Rojo', 'El gran pez', 'La pesca'][k] || 'Derecha'}">
        ${it.pares.length > 2 ? `<button data-a="pardel" data-i="${k}">✕</button>` : ''}</div>`).join('')}
        ${it.pares.length < 6 ? '<button data-a="paradd">+ Agregar pareja</button>' : ''}</div><p class="hint">Si aciertan solo algunas parejas, ganan puntos en proporción.</p>`; break;
    case 'versiculo':

          ${it.categorias.length < 3 ? '<button data-a="optadd" data-arr="categorias">+ Agregar categoría</button>' : ''}</div>
        <div class="fld"><span>Elementos — toca la categoría correcta de cada uno</span>${it.elementos.map((e, k) => `<div class="optrow">

          ${it.elementos.length > 2 ? `<button data-a="cldel" data-i="${k}">✕</button>` : ''}</div>`).join('')}
          ${it.elementos.length < 12 ? '<button data-a="cladd">+ Agregar elemento</button>' : ''}</div><p class="hint">Si clasifican solo algunos bien, ganan puntos en proporción.</p>`; break;
    }
    case 'error':
      h += fArea('Texto con una palabra cambiada', 'texto', it.texto, 'Porque de tal manera amó Dios al *pueblo*') +

    case 'linea':
      h += `<div class="fld"><span>Hechos en orden cronológico — marca con ⭐ el que deben ubicar</span>${listaEditable(it, 'elementos', false, false, 8, 'Hecho', true)}</div>

    case 'vf': h += `<div class="fld"><span>Respuesta correcta</span><div class="vfbtns"><button data-a="vf" data-v="true" class="${it.correcta ? 'on' : ''}">✔ Verdadero</button><button data-a="vf" data-v="false" class="${!it.correcta ? 'on' : ''}">✘ Falso</button></div></div>`; break;
    case 'completar':
      h += fTxt('Frase con espacio en blanco', 'frase', it.frase, 'Ej: Porque de tal manera amó Dios al ___') + '<p class="hint">Escribe ___ (tres guiones bajos) donde va la palabra que falta.</p>' +
        fTxt('Respuestas aceptadas (separadas por coma)', 'aceptadas', it.aceptadas, 'mundo, el mundo') + '<p class="hint">No importan mayúsculas ni tildes.</p>'; break;
    case 'ordenar': h += `<div class="fld"><span>Elementos en el ORDEN CORRECTO (se mezclan al jugar)</span>${listaEditable(it, 'elementos', false, false, 8)}</div>`; break;
    case 'numero':

function actualizarPinMark() {
  const it = objActual(), m = $('#pinmark'); if (!m) return;
  m.style.left = it.x + '%'; m.style.top = it.y + '%'; m.style.width = (it.radio * 2) + '%';

/* =================== PRESENTAR (pantalla principal) =================== */
let H = null;
function detenerHost() { if (H) { clearInterval(H.timer); try { H.peer && H.peer.destroy(); } catch (e) { } H = null; } }
function vistaPresentar() {

function renderArmado() {
  const q = P.q; if (!q) return;
  $('#jarm').innerHTML = P.armado.length ? P.armado.map((i, k) => `<button data-a="jvq" data-k="${k}">${esc(q.palabras[i])}</button>`).join('') : '<span class="ph">Toca las palabras en orden…</span>';
  $('#jbanco').innerHTML = q.palabras.map((w, i) => P.armado.includes(i) ? '' : `<button data-a="jvp" data-i="${i}">${esc(w)}</button>`).join('');
}
function renderEquipos() {
  clearInterval(P.tInt);
  marcoJ(`<div class="estado-big">✅</div><h2>¡Estás dentro!</h2><p>Elige tu equipo:</p>
    <div class="jeq">${P.equipos.map((n, i) => `<button data-a="jeq" data-i="${i}" class="${P.eq === i ? 'on' : ''}" style="background:${COLORES[i % 6]}">${P.eq === i ? '✔ ' : ''}${esc(n)}</button>`).join('')}</div>
    <p>Espera a que comience.</p>`);
}
function filasOrden() {
  return P.orden.map((x, k) => `<div><b>${k + 1}</b><span>${esc(x.o)}</span><button data-a="jmov" data-i="${k}" data-d="-1">▲</button><button data-a="jmov" data-i="${k}" data-d="1">▼</button></div>`).join('');
}

iniciar();
</script>
