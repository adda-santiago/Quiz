<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Quiz Iglesia</title>
<meta name="theme-color" content="#FDF8FF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Source+Code+Pro:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
/* =========================================================
   Sistema de diseño "Sanctuary Tech — Quiz Iglesia" (Google Stitch)
   ========================================================= */
:root{
  --c:#180157; /* primario (se puede cambiar en la configuración del quiz) */
  --primary-container:#2D1E6B; --on-primary-container:#E6DEFF;
  --secondary:#006780; --secondary-container:#76DCFF; --on-secondary-container:#003543;
  --tertiary:#A21CAF; --tertiary-container:#FAE8FF; --on-tertiary-container:#701A75;
  --gold:#F59E0B; --cyan:#06B6D4; --violet:#7C3AED;
  --success:#059669; --success-container:#D1FAE5; --warning:#D97706; --error:#BA1A1A; --error-container:#FFDAD6;
  --bg:#FDF8FF; --s-lowest:#FFFFFF; --s-low:#F7F2F9; --s:#F1ECF4; --s-high:#EBE6EE; --s-highest:#E6E1E8;
  --on-s:#1C1B20; --on-s-var:#484550; --outline:#797582; --outline-var:#C9C4D2;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Source Code Pro",ui-monospace,Menlo,monospace;
  --sombra:0 1px 2px #1801570f,0 6px 20px #1801570d;
  --r-md:12px; --r-lg:16px; --r-xl:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--on-s);-webkit-font-smoothing:antialiased;line-height:1.4}
h1,h2,h3{margin:.2em 0;line-height:1.15}
h1,h2{font-family:var(--serif);font-weight:400;letter-spacing:-.25px;color:var(--c)}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:1.3em;line-height:1;display:inline-block;white-space:nowrap;letter-spacing:normal;text-transform:none;direction:ltr;font-feature-settings:'liga';-webkit-font-feature-settings:'liga';vertical-align:-.22em;overflow:hidden;max-width:1.3em}
.ms.fill{font-variation-settings:'FILL' 1}
.ms.gold,.fila2 .ms.gold{color:var(--gold)}
.sp{flex:1}
.muted{color:var(--on-s-var);font-size:.95rem}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--outline-var);border-radius:var(--r-md);padding:.6em 1.1em;background:var(--s-low);color:var(--on-s);display:inline-flex;align-items:center;justify-content:center;gap:.5em;transition:background-color .12s ease-out,border-color .12s ease-out,transform .12s ease-out}
button:hover{background:var(--s-high)}
button:active{transform:scale(.98)}
button.pri{background:var(--c);border-color:var(--c);color:#fff}
button.pri:hover{background:var(--c);filter:brightness(1.25)}
button.sec{background:var(--secondary);border-color:var(--secondary);color:#fff}
button.sec:hover{background:var(--secondary);filter:brightness(1.15)}
button.big{font-size:1.05rem;padding:.9em 1.6em}
button:disabled{opacity:.45;cursor:default;transform:none}
button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
input,textarea,select{font:inherit;padding:.65em .85em;border:1px solid var(--outline-var);border-radius:var(--r-md);width:100%;background:var(--s-lowest);color:var(--on-s)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--c);box-shadow:0 0 0 3px #1801571f}
input[type=checkbox]{width:auto;accent-color:var(--c);width:18px;height:18px}
input[type=range]{accent-color:var(--c);padding:0;border:0}
input[type=color]{padding:3px;height:44px;width:84px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font-size:.8rem;font-weight:600;letter-spacing:.2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.cyan{background:var(--secondary-container);color:var(--on-secondary-container)}
.badge.ind{background:var(--primary-container);color:var(--on-primary-container)}
.badge.ind .ms{color:var(--cyan)}
.badge.mag{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.badge.out{background:var(--s-lowest);border:1px solid var(--outline-var);color:var(--secondary)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:var(--secondary)}
.logo{width:44px;height:44px;border-radius:var(--r-md);background:var(--c);display:grid;place-items:center;flex:none;box-shadow:var(--sombra)}
.logo .ms{color:var(--gold);font-size:28px;max-width:none}
.card{background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-xl);box-shadow:var(--sombra)}
.top{background:color-mix(in srgb,var(--bg) 95%,transparent);border-bottom:1px solid var(--outline-var);position:sticky;top:0;z-index:5}
.top-in{max-width:1168px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:14px;min-width:0}
.marca b{display:block;color:var(--c);font-size:1.05rem;line-height:1.2}
.marca small{display:block;color:var(--on-s-var);font-size:.78rem;font-weight:600}
.ibtn{width:42px;height:42px;padding:0;border-radius:50%;background:var(--s)}
.ibtn .ms{max-width:none}
.eyebrow{display:block;font-size:.78rem;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--gold)}
/* ---------- Inicio ---------- */
.inicio{min-height:100vh;display:flex;flex-direction:column}
.home{flex:1;width:100%;max-width:1168px;margin:0 auto;padding:48px 24px}
.hero{text-align:center;max-width:720px;margin:0 auto 48px}
.hero h1{font-size:clamp(2.2rem,5.4vw,3.6rem);line-height:1.08;margin:18px 0 16px}
.hero .lead{color:var(--on-s-var);font-size:1.05rem;margin:0}
.home-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:32px;align-items:start}
.qcard{overflow:hidden}
.qhead{background:var(--primary-container);color:#fff;padding:24px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.qhead h2{color:#fff;font-size:2rem;margin:4px 0 0}
.qhead .badge{background:#ffffff14;border:1px solid #ffffff40;color:#fff}
.qhead .badge .ms{color:var(--cyan)}
.qbody{padding:28px 32px 32px}
.qbody p.muted{margin:0 0 20px}
.fila2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fila2 button{justify-content:flex-start;padding:.85em 1.1em;background:var(--s-low)}
.fila2 button.pri,.fila2 button.big{justify-content:center}
.fila2 button.pri{background:var(--c)}
.sep{border:0;border-top:1px solid var(--outline-var);margin:28px 0 20px}
.lbl-sm{font-size:.82rem;font-weight:600;color:var(--on-s-var);margin:0 0 10px}
.fila2 .ms{color:var(--c)}
.fila2 .pri .ms{color:var(--gold)}
.jcard{padding:32px;background:var(--s-low);display:flex;flex-direction:column;gap:14px}
.jcard .cab{display:flex;align-items:center;justify-content:space-between}
.tile{width:48px;height:48px;border-radius:var(--r-md);background:var(--secondary-container);color:var(--on-secondary-container);display:grid;place-items:center}
.tile .ms{max-width:none;font-size:28px}
.jcard h2{font-size:2.2rem;margin:4px 0 0}
.jcard p{margin:0;color:var(--on-s-var)}
.campo-cod{position:relative}
.campo-cod .ms{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--secondary)}
.campo-cod input{padding:.75em .9em .75em 48px;font-family:var(--mono);font-size:1.5rem;font-weight:700;letter-spacing:.25em}
.campo-cod input::placeholder{letter-spacing:.1em;font-weight:600;color:var(--outline)}
.etq{font-weight:600;font-size:.9rem;margin-top:6px}
.nota{display:flex;gap:10px;align-items:flex-start;background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);padding:14px 16px;font-size:.92rem;color:var(--on-s-var)}
.nota .ms{color:var(--gold)}
.pie{border-top:1px solid var(--outline-var);background:var(--s)}
.pie .top-in{font-size:.9rem;color:var(--on-s-var);justify-content:space-between}
@media (max-width:860px){
  .home{padding:24px 16px}
  .hero{text-align:left;margin-bottom:24px}
  .hero .badge{display:none}
  .hero h1{font-size:2.1rem;margin:0 0 8px}
  .hero .lead{font-size:.95rem}
  .home-grid{grid-template-columns:1fr;gap:20px}
  .jcard{order:-1;padding:22px}
  .qhead{padding:18px 22px}
  .qhead h2{font-size:1.7rem}
  .qbody{padding:20px 22px 22px}
  .qbody p.muted{display:none}
  .fila2.small button{font-size:.88rem;padding:.7em .8em}
  .larga{display:none}
  .top-in{padding:12px 16px}
}
/* ---------- Editor ---------- */
.editor{display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{display:flex;gap:8px;align-items:center;padding:10px 16px;background:var(--s-lowest);border-bottom:1px solid var(--outline-var);z-index:2}
.bar .titulo{max-width:380px;font-weight:600}
.bar .ms{color:var(--c);max-width:none}
.bar .pri .ms{color:var(--gold)}
.ed-body{flex:1;display:flex;min-height:0}
#lista{width:330px;overflow:auto;background:var(--s-low);border-right:1px solid var(--outline-var);padding:12px}
.li{display:flex;align-items:center;gap:8px;padding:10px;border-radius:var(--r-md);cursor:pointer;margin-bottom:6px;background:var(--s-lowest);border:1px solid var(--outline-var)}
.li:hover{border-color:var(--outline)}
.li.sel{border:2px solid var(--c);padding:9px;box-shadow:var(--sombra)}
.li .n{font-size:.8rem;color:var(--outline);width:20px;font-family:var(--mono)}
.li .tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.92rem}
.li .acts{display:none;gap:2px}
.li:hover .acts,.li.sel .acts{display:flex}
.li .acts button{padding:2px 7px;font-size:.8rem;border-radius:8px}
.add{margin-top:16px}
.add p{margin:4px 0 8px;font-weight:600;font-size:.85rem;color:var(--on-s-var)}
.add button{display:flex;justify-content:flex-start;width:100%;text-align:left;margin-bottom:6px;background:var(--s-lowest);border:1px dashed var(--outline-var);font-weight:500}
.add button:hover{border-color:var(--c);background:var(--s-lowest)}
#form{flex:1;overflow:auto;padding:24px 32px;max-width:920px}
#form>h2{font-size:2.2rem}
.fld{display:block;margin:14px 0}
.fld>span{display:block;font-weight:600;font-size:.88rem;margin-bottom:6px;color:var(--on-s)}
.fld.sm{display:inline-block;width:180px;margin-right:12px;vertical-align:top}
.fila{display:flex;flex-wrap:wrap;gap:0 12px}
.fila .fld.sm{flex:0 1 180px;width:auto;margin-right:0}
.fila .fld.ancho{flex-basis:300px}
.mnav,.macts{display:none}
.chkf{display:flex;gap:10px;align-items:center;margin:14px 0;font-weight:600}
.optrow{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.optrow input{min-width:0}
.optrow .sh{color:#fff;width:40px;height:40px;border-radius:var(--r-md);display:grid;place-items:center;flex:none;font-weight:700}
.chk{background:var(--s);color:var(--outline-var)}
.chk.on{background:var(--success);border-color:var(--success);color:#fff}
.imgrow{display:flex;gap:6px}
.imgrow input{flex:1}
.thumb{max-height:160px;max-width:100%;margin-top:8px;border-radius:var(--r-md)}
.hint{font-size:.85rem;color:var(--on-s-var);margin:4px 0}
.pinprev{position:relative;display:inline-block;max-width:100%;cursor:crosshair;margin-top:8px}
.pinprev img{display:block;max-width:100%;max-height:420px;border-radius:var(--r-md)}
.pinmark{position:absolute;aspect-ratio:1;border-radius:50%;background:#BA1A1A44;border:3px solid var(--error);transform:translate(-50%,-50%);pointer-events:none}
.vfbtns{display:flex;gap:10px}
.vfbtns button.on{background:var(--success);border-color:var(--success);color:#fff}
.clb{background:var(--s);color:var(--outline);min-width:44px;padding:.5em .5em}
.clb.on{background:var(--cc);border-color:var(--cc);color:#fff}
.parrow>span{font-weight:700;color:var(--outline)}
.ubi{background:var(--s);filter:grayscale(1);opacity:.45}
.ubi.on{background:#FEF3C7;border-color:var(--gold);filter:none;opacity:1}
.aviso{color:var(--error);font-weight:600}
@media (max-width:760px){
  .bar{gap:6px;padding:8px 10px}
  .bar .lbl{display:none}
  .bar button{padding:.55em .7em}
  .bar .titulo{flex:1;min-width:0;max-width:none}
  .bar #bUndo,.bar #bRedo{padding:.55em .45em}
  .bar .guardado{display:none}
  .bar .sp{display:none}
  .editor.vista-lista #form{display:none}
  .editor.vista-form #lista{display:none}
  #lista{width:100%;border-right:0;padding:12px 12px 24px}
  .li{padding:12px 10px}
  .li.sel{padding:11px 9px}
  .li .acts,.li:hover .acts,.li.sel .acts{display:none}
  .add .tipos{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .add button{margin:0;padding:.8em .6em;font-size:.9rem}
  #form{padding:0 14px 28px;max-width:none}
  #form>h2{font-size:1.9rem}
  .mnav{display:flex;align-items:center;gap:6px;position:sticky;top:0;z-index:1;background:var(--bg);padding:10px 0;margin-bottom:4px;border-bottom:1px solid var(--outline-var)}
  .mnav .pos{font-weight:700;color:var(--on-s-var);min-width:56px;text-align:center;font-family:var(--mono)}
  .mnav button{padding:.55em .9em}
  .macts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:22px;padding-top:14px;border-top:1px solid var(--outline-var)}
  .macts button{padding:.7em .3em;font-size:.86rem}
  .macts .peligro{background:var(--error-container);border-color:var(--error-container);color:#93000A}
  .fila .fld.sm,.fila .fld.ancho{flex:1 1 140px}
  .fld.sm{width:100%;margin-right:0}
  .optrow{gap:4px}
  .optrow .sh{width:36px;height:36px}
  .optrow button{padding:.5em .6em}
  .vfbtns button{flex:1;padding:.9em}
  input[type=color]{width:100%}
  .pinprev{display:block}
}
/* ---------- Presentación (pantalla grande) ---------- */
.host{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
.host .top-in{justify-content:space-between}
.pills{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prog{height:6px;background:var(--s-high)}
.prog i{display:block;height:100%;background:var(--cyan);transition:width .3s ease}
.stage{flex:1;width:100%;max-width:1168px;margin:0 auto;padding:28px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center}
.ctl{width:100%;max-width:1168px;margin:0 auto;padding:0 24px 20px}
.ctl-in{display:flex;align-items:center;gap:12px;background:var(--s-low);border:1px solid var(--outline-var);border-radius:var(--r-xl);padding:14px 16px 14px 24px;color:var(--on-s-var);font-size:.92rem}
.ctl-in>.ms{color:var(--secondary)}
.ctl-in button.pri .ms{color:var(--gold)}
.warn{background:#FEF3C7;color:#78350F;border:1px solid #FCD34D;border-radius:var(--r-lg);padding:12px 18px;font-weight:600;max-width:760px}
.join{display:flex;gap:36px;align-items:center;padding:28px 36px;flex-wrap:wrap;justify-content:center;text-align:left}
.join .qr svg{width:220px;height:220px;display:block}
.join p{margin:4px 0;color:var(--on-s-var)}
.join .code{font-family:var(--mono);font-size:4.2rem;font-weight:700;letter-spacing:.14em;color:var(--c);line-height:1.1}
.join .url{font-weight:700;word-break:break-all;max-width:380px;color:var(--secondary)}
.lobby-t,.stage>h1{font-size:clamp(2.4rem,5vw,3.6rem);margin:0}
.players{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1100px}
.chip{background:var(--s-lowest);border:1px solid var(--outline-var);color:var(--on-s);border-radius:999px;padding:8px 16px;font-weight:600;font-size:1.05rem;cursor:pointer;box-shadow:var(--sombra)}
.chip.off{opacity:.45}
.chip:hover{text-decoration:line-through;border-color:var(--error)}
.qimg{max-height:42vh;max-width:90%;border-radius:var(--r-lg);box-shadow:var(--sombra)}
.hq-card{width:100%;text-align:left;padding:28px 32px;display:flex;flex-direction:column;gap:18px}
.hq-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{display:inline-flex;align-items:center;gap:8px;background:var(--c);color:#fff;border-radius:999px;padding:6px 16px;font-family:var(--mono);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums}
.timer .ms{color:var(--gold)}
.hq-q{font-family:var(--serif);font-size:clamp(2rem,4.2vw,3.5rem);line-height:1.1;color:var(--c);margin:0;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.opt{display:flex;align-items:center;gap:20px;background:var(--s-lowest);border:2px solid var(--outline-var);border-radius:var(--r-xl);padding:20px 24px;font-size:clamp(1.1rem,2.1vw,1.6rem);font-weight:600;text-align:left;position:relative;overflow:hidden;box-shadow:var(--sombra);min-height:96px}
.opt .f{width:56px;height:56px;border-radius:var(--r-lg);background:var(--oc);color:#fff;display:grid;place-items:center;font-size:1.5rem;font-weight:700;flex:none}
.opt .cnt{margin-left:auto;font-family:var(--mono);font-weight:700;font-size:1.3em;color:var(--on-s-var)}
.opt.ok{border-color:var(--success);background:#ECFDF5}
.opt.ok .cnt{color:var(--success)}
.opt.dim{opacity:.38}
.opt .barra{position:absolute;left:0;bottom:0;height:6px;background:var(--oc);opacity:.55}
.frase{font-family:var(--serif);font-size:clamp(1.8rem,4vw,3.2rem);line-height:1.2;color:var(--c);max-width:1100px}
.blank{display:inline-block;min-width:4ch;border-bottom:5px solid var(--gold);color:var(--tertiary)}
.lista-ord{display:flex;flex-direction:column;gap:10px;min-width:min(700px,90vw)}
.lista-ord div{background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);padding:12px 18px;font-size:1.4rem;font-weight:600;text-align:left;box-shadow:var(--sombra)}
.lista-ord b{color:var(--c);margin-right:12px;font-family:var(--mono)}
.pinhost{position:relative;display:inline-block}
.pinhost img{display:block;max-height:56vh;max-width:90vw;border-radius:var(--r-lg)}
.pinhost .tgt{position:absolute;aspect-ratio:1;border-radius:50%;border:4px solid var(--success);background:#05966944;transform:translate(-50%,-50%)}
.pinhost .pp{position:absolute;transform:translate(-50%,-100%);font-size:1.7rem;filter:drop-shadow(0 2px 2px #0006)}
.linea{position:relative;width:min(1000px,90vw);height:120px;margin-top:20px}
.linea .eje{position:absolute;left:0;right:0;top:60px;height:6px;background:var(--outline-var);border-radius:3px}
.linea .d{position:absolute;top:22px;transform:translateX(-50%);font-size:1.6rem}
.linea .ok{position:absolute;top:40px;transform:translateX(-50%);width:6px;height:46px;background:var(--success);border-radius:3px}
.linea .okl{position:absolute;top:92px;transform:translateX(-50%);font-weight:700;font-size:1.4rem;color:var(--success)}
.linea .mm{position:absolute;top:92px;font-weight:600;color:var(--on-s-var)}
.nube{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center;max-width:1100px}
.nube span{font-weight:700;line-height:1.1}
.tops{display:flex;flex-direction:column;gap:8px;min-width:min(520px,90vw)}
.tops div{display:flex;justify-content:space-between;background:var(--s-lowest);border:1px solid var(--outline-var);padding:8px 16px;border-radius:var(--r-md);font-size:1.15rem}
.rank{display:flex;flex-direction:column;gap:10px;width:min(900px,92vw)}

/* ---------- Transiciones y animaciones ---------- */
@keyframes anFundido{from{opacity:0}}
@keyframes anDeslizar{from{opacity:0;transform:translateX(90px)}}
@keyframes anZoom{from{opacity:0;transform:scale(.88)}}
@keyframes anSubir{from{opacity:0;transform:translateY(60px)}}
@keyframes anIzq{from{opacity:0;transform:translateX(-14cqw)}}
@keyframes anDer{from{opacity:0;transform:translateX(14cqw)}}
.stage.an-fundido>*{animation:anFundido .5s ease both}
.stage.an-deslizar>*{animation:anDeslizar .55s cubic-bezier(.2,0,0,1) both}
.stage.an-zoom>*{animation:anZoom .5s cubic-bezier(.2,0,0,1) both}
.stage.an-subir>*{animation:anSubir .55s cubic-bezier(.2,0,0,1) both}
.stage[class*=an-]>*:nth-child(2){animation-delay:.08s}.stage[class*=an-]>*:nth-child(3){animation-delay:.16s}.stage[class*=an-]>*:nth-child(n+4){animation-delay:.22s}
.lienzo .ea-aparecer{animation:anFundido .7s ease both}
.lienzo .ea-subir{animation:anSubir .7s cubic-bezier(.2,0,0,1) both}
.lienzo .ea-zoom{animation:anZoom .6s cubic-bezier(.2,0,0,1) both}
.lienzo .ea-izquierda{animation:anIzq .7s cubic-bezier(.2,0,0,1) both}
.lienzo .ea-derecha{animation:anDer .7s cubic-bezier(.2,0,0,1) both}
.jug .cuerpo{animation:anFundido .3s ease both}
.pausa-vel{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#18015799;color:#fff;z-index:20;pointer-events:none;animation:anFundido .25s ease}
.pausa-vel .ms{font-size:120px;max-width:none;color:var(--gold)}
.pausa-vel b{font:400 4rem var(--serif)}
.jpausa{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:#180157e6;color:#fff;z-index:20;animation:anFundido .25s ease}
.jpausa .ms{font-size:96px;max-width:none;color:var(--gold)}
.jpausa b{font:400 3rem var(--serif)}
.ibtn.on{background:var(--secondary-container);border-color:var(--secondary-container)}
.ctl-in button{white-space:nowrap}
.modal{position:fixed;inset:0;background:#0f0e12a6;display:grid;place-items:center;z-index:30;padding:16px;animation:anFundido .2s}
.modal-in{max-width:440px;width:100%;padding:28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;animation:anZoom .25s cubic-bezier(.2,0,0,1)}
.modal-in h2{display:flex;align-items:center;gap:10px;margin:0}
.modal-in .qr svg{width:230px;height:230px;display:block}
.remoto .cuerpo{justify-content:flex-start;gap:16px}
.r-main{width:100%;max-width:520px;font-size:1.35rem;padding:1.2em}
.r-fila{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;width:100%;max-width:520px}
.r-fila button{padding:1em .6em}
@media (max-width:760px){.ctl-in{flex-wrap:wrap;justify-content:flex-end}}
/* ---------- Diapositivas (lienzo 16:9) ---------- */
.lienzo{position:relative;width:100%;aspect-ratio:16/9;container-type:size;overflow:hidden;border-radius:var(--r-lg);box-shadow:var(--sombra);background:#180157;user-select:none;-webkit-user-select:none}
.stage .lienzo{width:min(100%,calc((100vh - 200px) * 16 / 9));width:min(100%,calc((100dvh - 200px) * 16 / 9));border-radius:var(--r-xl);text-align:initial}
.lz-el{position:absolute;display:flex;flex-direction:column}
.lz-el.t-texto{padding:.6cqw 1.2cqw;white-space:pre-wrap;overflow-wrap:break-word;line-height:1.15;font-size:calc(var(--fs) * 1cqw / 12.8)}
.lz-el .tx{width:100%;outline:none}
.lz-el img{width:100%;height:100%;display:block;border-radius:inherit;pointer-events:none}
.ph-img{width:100%;height:100%;display:grid;place-items:center;text-align:center;border:2px dashed #ffffffaa;border-radius:inherit;color:#fff;background:#ffffff1a;font:600 calc(15 * 1cqw / 12.8)/1.3 var(--sans)}
.ed-lz .lz-el{cursor:move;touch-action:none}
.ed-lz .lz-el:hover{outline:1px dashed #ffffffb3}
.ed-lz .lz-el.sel{outline:2px solid var(--cyan);outline-offset:1px}
.ed-lz .lz-el.editando{cursor:text;outline-style:dashed;user-select:text;-webkit-user-select:text}
.lz-el .h{--hs:12px;position:absolute;width:var(--hs);height:var(--hs);background:#fff;border:2px solid var(--cyan);border-radius:3px;touch-action:none;z-index:2;margin:calc(var(--hs) / -2)}
.h.nw{left:0;top:0;cursor:nwse-resize}.h.n{left:50%;top:0;cursor:ns-resize}.h.ne{left:100%;top:0;cursor:nesw-resize}.h.e{left:100%;top:50%;cursor:ew-resize}
.h.se{left:100%;top:100%;cursor:nwse-resize}.h.s{left:50%;top:100%;cursor:ns-resize}.h.sw{left:0;top:100%;cursor:nesw-resize}.h.w{left:0;top:50%;cursor:ew-resize}
@media (pointer:coarse){.lz-el .h{--hs:16px;border-radius:50%}.lz-el .h.n,.lz-el .h.s{display:none}}
.guia{position:absolute;background:var(--gold);pointer-events:none;z-index:3}

.lz-wrap{padding:8px 0}

.sp-sec{background:var(--s-lowest);border:1px solid var(--outline-var);border-radius:var(--r-lg);padding:14px 16px}
.sp-sec h3{font:600 1rem var(--sans);margin:0 0 12px;color:var(--c);display:flex;align-items:center;gap:8px}
.sp-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}

function teclasDiapositiva(e) {
  const it = diapoActual(); if (!it || !sSel || sEdit || ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;

/* ---------- Archivo / almacenamiento ---------- */
const LS = 'quiziglesia.quiz';
let quiz = (() => { try { const q = JSON.parse(localStorage.getItem(LS)); return q && q.items ? normalizarQuiz(q) : ejemploQuiz(); } catch (e) { return ejemploQuiz(); } })();
/* El quiz se guarda en IndexedDB (mucho más espacio que localStorage, que queda solo como respaldo). */
const IDB = {
  db: null,
  abrir() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((ok, mal) => {
      const r = indexedDB.open('quiziglesia', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('datos');
      r.onsuccess = () => ok(this.db = r.result); r.onerror = () => mal(r.error);
    });
  },
  get(k) { return this.abrir().then(db => new Promise((ok, mal) => { const q = db.transaction('datos').objectStore('datos').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => mal(q.error); })); },
  set(k, v) { return this.abrir().then(db => new Promise((ok, mal) => { const tx = db.transaction('datos', 'readwrite'); tx.objectStore('datos').put(v, k); tx.oncomplete = () => ok(); tx.onerror = tx.onabort = () => mal(tx.error); })); },
};
let tGuardar = null, errorGuardadoAvisado = false;
function guardarLocal() { estadoGuardado('guardando'); clearTimeout(tGuardar); tGuardar = setTimeout(guardarAhora, 400); }
function guardarAhora() {
  clearTimeout(tGuardar); tGuardar = null;
  const s = JSON.stringify(quiz);
  registrarHistorial(s);
  return IDB.set('actual', s).then(() => { estadoGuardado('ok'); try { localStorage.removeItem(LS); } catch (_) { } })
    .catch(e => { console.warn(e); try { localStorage.setItem(LS, s); estadoGuardado('ok'); } catch (_) { estadoGuardado('error'); } });
}
document.addEventListener('visibilitychange', () => { if (document.hidden && tGuardar) guardarAhora(); });
function estadoGuardado(st) {
  const el = $('#guardado');
  if (el) { el.className = 'guardado ' + st; el.innerHTML = st === 'error' ? `${ic('error')}<span class="lbl">No se pudo guardar</span>` : st === 'ok' ? `${ic('cloud_done')}<span class="lbl">Guardado</span>` : `${ic('sync')}<span class="lbl">Guardando…</span>`; }
  if (st === 'error' && !errorGuardadoAvisado) { errorGuardadoAvisado = true; aviso('⚠️ No se pudo guardar en este navegador. Descarga el archivo con 💾 para no perder cambios.', 8000); }
}
function aviso(msg, ms = 2200) {
  let t = $('#toast'); if (!t) { t = document.createElement('div'); t.id = 'toast'; document.body.appendChild(t); }
  t.textContent = msg; t.className = 'ver'; clearTimeout(t._t); t._t = setTimeout(() => t.className = '', ms);
}
const HIST = { pila: [], pos: -1 };
function registrarHistorial(s) {
  if (HIST.pila[HIST.pos] === s) return;
  HIST.pila = HIST.pila.slice(0, HIST.pos + 1); HIST.pila.push(s);
  if (HIST.pila.length > 60) HIST.pila.shift();
  HIST.pos = HIST.pila.length - 1; botonesHistorial();
}
function botonesHistorial() { const u = $('#bUndo'), r = $('#bRedo'); if (u) u.disabled = HIST.pos <= 0; if (r) r.disabled = HIST.pos >= HIST.pila.length - 1; }
function moverHistorial(d) {
  if (tGuardar) guardarAhora();
  const j = HIST.pos + d; if (j < 0 || j >= HIST.pila.length) return;
  HIST.pos = j; quiz = JSON.parse(HIST.pila[j]);
  IDB.set('actual', HIST.pila[j]).then(() => estadoGuardado('ok')).catch(() => estadoGuardado('error'));
  if (edSel >= quiz.items.length) edSel = quiz.items.length - 1;
  sSel = null; sEdit = false; sItem = null;
  const t = $('#qTitulo'); if (t) t.value = quiz.config.titulo;
  if ($('#lista')) { renderLista(); renderForm(); }
  botonesHistorial(); aviso(d < 0 ? '↶ Deshecho' : '↷ Rehecho', 1200);
}

const midi = n => 440 * Math.pow(2, (n - 69) / 12);
const SND = {
  ctx: null, master: null, musica: null,
  silencio: (() => { try { return localStorage.getItem('quiziglesia.silencio') === '1'; } catch (_) { return false; } })(),
  init() {
    if (!this.ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = this.silencio ? 0 : 0.7; this.master.connect(this.ctx.destination); }

  alternar() { this.silencio = !this.silencio; try { localStorage.setItem('quiziglesia.silencio', this.silencio ? '1' : '0'); } catch (_) { } if (this.master) this.master.gain.value = this.silencio ? 0 : 0.7; },
  nota(f, t, d, o = {}) {

  },

    g.gain.setValueAtTime(o.vol0 ?? (o.vol || 0.1), t); g.gain.exponentialRampToValueAtTime(o.vol1 ?? 0.0001, t + d);

  efecto(nombre) {

    switch (nombre) {

      case 'tic': N(96, 0, 0.07, { tipo: 'square', vol: 0.05 }); break;
      case 'revelar': [60, 64, 67, 72].forEach((m, k) => N(m + 12, k * 0.07, 0.5, { vol: 0.14 })); N(48, 0, 0.6, { tipo: 'sine', vol: 0.2 }); break;
      case 'transicion': this.ruido(t, 0.35, { filtro: 'bandpass', fq: 400, fq2: 3000, vol0: 0.08, vol1: 0.0001 }); break;
      case 'redoble': for (let k = 0; k < 22; k++) this.ruido(t + k * 0.055, 0.05, { filtro: 'bandpass', fq: 1800, vol: 0.05 + k * 0.006 }); N(48, 1.25, 0.5, { tipo: 'sine', vol: 0.3 }); this.ruido(t + 1.25, 0.4, { fq: 3000, vol: 0.12 }); break;
      case 'fanfarria': [[67, 0], [72, 0.15], [76, 0.3], [79, 0.45], [76, 0.75], [79, 0.9]].forEach(([m, dt]) => { N(m, dt, dt > 0.8 ? 0.9 : 0.3, { tipo: 'sawtooth', vol: 0.07 }); N(m - 12, dt, 0.3, { vol: 0.08 }); }); [60, 64, 67, 72].forEach(m => N(m, 0.9, 1.2, { vol: 0.07 })); break;
      case 'pausa': N(72, 0, 0.15, { tipo: 'sine', vol: 0.12 }); N(67, 0.12, 0.25, { tipo: 'sine', vol: 0.12 }); break;
    }
  },
  musicaIniciar(modo) {
    this.musicaParar(0.05);
    if (!quiz.config.musica || !this.init()) return;
    const c = this.ctx, g = c.createGain(); g.gain.value = modo === 'lobby' ? 0.22 : 0.3; g.connect(this.master);
    const lobby = modo === 'lobby', sem = 60 / (lobby ? 84 : 128) / 2;
    const acordes = lobby ? [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 65]] : [[60, 64, 67, 72], [55, 59, 62, 67], [57, 60, 64, 69], [53, 57, 60, 65]];
    let paso = 0, prox = c.currentTime + 0.05;
    const id = setInterval(() => {
      while (prox < c.currentTime + 0.25) {
        const a = acordes[Math.floor(paso / 8) % 4], k = paso % 8;
        if (lobby) { if (k % 2 === 0) this.nota(midi(a[[0, 2, 1, 3][(k / 2) | 0]] + 12), prox, sem * 3, { tipo: 'sine', vol: 0.12, dest: g, ataque: 0.05 }); if (k === 0) this.nota(midi(a[0] - 12), prox, sem * 7.5, { tipo: 'sine', vol: 0.18, dest: g, ataque: 0.2 }); }
        else {
          this.nota(midi(a[[0, 1, 2, 3, 2, 1, 2, 3][k]] + 12), prox, sem * 0.8, { tipo: 'triangle', vol: 0.1, dest: g });
          if (k % 4 === 0) this.nota(midi(a[0] - 12), prox, sem * 3.5, { tipo: 'sine', vol: 0.22, dest: g });
          if (k % 2 === 1) this.ruido(prox, 0.04, { fq: 7000, vol: 0.035, dest: g });
          if (k === 0 || k === 4) this.nota(90, prox, 0.12, { tipo: 'sine', hasta: 45, vol: 0.35, dest: g });
        }
        paso++; prox += sem;
      }
    }, 60);
    this.musica = { g, id };
  },
  musicaParar(fade = 0.4) {
    if (!this.musica) return;
    const m = this.musica; this.musica = null; clearInterval(m.id);
    try { m.g.gain.setTargetAtTime(0.0001, this.ctx.currentTime, fade / 3); } catch (_) { }
    setTimeout(() => { try { m.g.disconnect(); } catch (_) { } }, fade * 1000 + 300);
  },
};

/* ---------- Filtro de palabras (nombres y respuestas escritas) ---------- */
const FILTRO_BASE = ('puta,puto,mierda,weon,weona,wn,hueon,huevon,aweonao,aweonado,conchetumare,conchesumare,ctm,csm,concha,chucha,culiao,culiado,ql,qliao,kuliao,'
  + 'pico,pichula,raja,poto,culo,maricon,maricona,maraco,marica,idiota,estupido,estupida,imbecil,tarado,tarada,mongolico,retrasado,tonto,tonta,gil,'
  + 'pendejo,pendeja,cabron,carajo,verga,joder,coño,chingar,chingada,mamon,zorra,perra,bastardo,malparido,gonorrea,hijueputa,hdp,sexo,porno,pene,vagina,'
  + 'teta,tetas,caca,pedo,callate,hijo de puta').split(',');
const normFiltro = x => String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[0134578@$]/g, c => ({ 0: 'o', 1: 'i', 3: 'e', 4: 'a', 5: 's', 7: 't', 8: 'b', '@': 'a', $: 's' }[c]))
  .replace(/[^a-z\s]/g, ' ').replace(/([a-z])\1+/g, '$1').replace(/\s+/g, ' ').trim();
const extraFiltro = txt => String(txt || '').split(',').map(x => x.trim()).filter(Boolean);
function tieneGroseria(txt, extra) {
  const t = normFiltro(txt); if (!t) return false;
  const lista = FILTRO_BASE.concat(extra || []).map(normFiltro).filter(b => b.length >= 2);
  const tok = t.split(' '), pegadas = []; let buf = '';
  tok.forEach(w => { if (w.length === 1) buf += w; else { if (buf.length > 1) pegadas.push(buf); buf = ''; } }); // "p u t a"
  if (buf.length > 1) pegadas.push(buf);
  const suf = ['', 's', 'es', 'a', 'o', 'as', 'os', 'ito', 'ita', 'azo'];
  return lista.some(b => b.includes(' ') ? (' ' + t + ' ').includes(' ' + b + ' ')
    : tok.concat(pegadas).some(w => w === b || (b.length >= 3 && suf.some(x => w === b + x))));
}
const filtroQuiz = () => quiz.config.filtroActivo ? extraFiltro(quiz.config.palabrasBloqueadas) : null;
function bajar(nombre, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
  a.download = nombre; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function descargarQuiz() { bajar((slug(quiz.config.titulo) || 'quiz') + '.quiz.json', JSON.stringify(quiz, null, 2), 'application/json'); }
function abrirArchivo(cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = '.json,application/json';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    f.text().then(t => {
      try { const q = JSON.parse(t); if (!q.items) throw 0; quiz = normalizarQuiz(q); guardarLocal(); cb && cb(); }
      catch (e) { alert('El archivo no es un quiz válido.'); }
    });
  };
  i.click();
}
function leerAudio(cb) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'audio/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    if (f.size > 3e6 && !confirm(`El audio pesa ${(f.size / 1e6).toFixed(1)} MB y hará más pesado el archivo del quiz. ¿Usarlo igual?`)) return;
    const r = new FileReader(); r.onload = () => cb(r.result); r.readAsDataURL(f);
  };
  i.click();
}
function leerImagen(cb, max = 1200) {
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*';
  i.onchange = () => {
    const f = i.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      if (f.type === 'image/svg+xml' || f.type === 'image/gif') return cb(r.result);
      const img = new Image();
      img.onload = () => { // reducir para que el archivo no pese demasiado
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', max > 1200 ? 0.82 : 0.8));
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
  };
  i.click();
}

/* ---------- Utilidades de juego ---------- */
const tiempoDe = it => Number(it.tiempo) || Number(quiz.config.tiempo) || 20;
const aceptadas = it => String(it.aceptadas || '').split(',').map(norm).filter(Boolean);
const opcionesValidas = arr => arr.map((o, i) => ({ o, i })).filter(x => String(x.o).trim());
const esPregunta = it => it.tipo !== 'diapositiva';
const paresValidos = it => (it.pares || []).filter(p => String(p.a).trim() && String(p.b).trim());
const clasifValidos = it => (it.elementos || []).map((e, i) => ({ t: e.t, c: +e.c || 0, i })).filter(e => String(e.t).trim());
const catsDe = it => (it.categorias || []).map((c, i) => String(c).trim() || 'Grupo ' + (i + 1));
const pistasValidas = it => (it.pistas || []).filter(x => String(x).trim());
const abrev = c => ((String(c).match(/\p{Lu}/gu) || []).join('') || String(c).trim().slice(0, 2)).slice(0, 3);
function palabrasVersiculo(it) { // si el texto tiene "/", se corta en esos trozos; si no, palabra por palabra
  const t = String(it.texto || '').trim();
  return (t.includes('/') ? t.split('/') : t.split(/\s+/)).map(x => x.trim()).filter(Boolean);
}
const textoVersiculo = it => palabrasVersiculo(it).join(' ');
function tokensError(it) { // la palabra equivocada va entre *asteriscos*
  const tk = String(it.texto || '').trim().split(/\s+/).filter(Boolean);
  const idx = tk.findIndex(w => /\*[^*]+\*/.test(w)), m = idx >= 0 ? tk[idx].match(/^(.*)\*([^*]+)\*(.*)$/) : null;
  return { tokens: tk.map(w => w.replace(/\*/g, '')), idx, antes: m ? m[1] : '', palabra: m ? m[2] : '', despues: m ? m[3] : '' };
}
function lineaDe(it) { // hechos fijos (en orden) + el hecho que hay que ubicar y su posición correcta
  const v = opcionesValidas(it.elementos || []);
  let u = v.findIndex(x => x.i === +it.ubicar); if (u < 0) u = 0;
  return { hecho: v[u] ? v[u].o : '', fijos: v.filter((_, k) => k !== u).map(x => x.o), pos: u };
}
const palabrasHuecos = it => String(it.palabras || '').split(',').map(x => x.trim()).filter(Boolean);
const nHuecos = it => (String(it.frase || '').match(/_{3,}/g) || []).length;
const afirmValidas = it => (it.afirmaciones || []).filter(a => String(a.t).trim());
const paresMem = it => (it.pares || []).filter(x => String(x.a).trim()).map(x => ({ a: String(x.a).trim(), b: String(x.b || '').trim() || String(x.a).trim() }));
const aceptadasPalabra = it => [norm(it.palabra)].concat(aceptadas(it)).filter(Boolean);
const letrasPalabra = w => [...String(w || '').toUpperCase()].map((c, i) => /\p{L}|\p{N}/u.test(c) ? i : -1).filter(i => i >= 0);
const letrasVisibles = (n, ms, T) => n ? Math.max(0, Math.min(n - 1, Math.floor(Math.max(0, ms) / (T * 0.85) * n))) : 0;
const pistasVisibles = (n, ms, T) => n ? Math.min(n, 1 + Math.floor(Math.max(0, ms) / (T / n))) : 0;
// Fracción correcta de una respuesta (0 a 1). La mayoría es todo o nada; parejas y clasificar dan puntaje parcial.
function fraccion(it, v) {
  try {
    switch (it.tipo) {
      case 'alternativas': case 'emoji': case 'revela': case 'zoom': case 'audio': return it.correctas.includes(Number(v)) ? 1 : 0;
      case 'vf': return v === it.correcta ? 1 : 0;
      case 'completar': case 'quiensoy': return aceptadas(it).includes(norm(v)) ? 1 : 0;
      case 'pin': { const dx = v.x - it.x, dy = (v.y - it.y) * (it.ar || 1); return Math.hypot(dx, dy) <= it.radio ? 1 : 0; }
      case 'ordenar': { const ok = opcionesValidas(it.elementos).map(x => x.i); return Array.isArray(v) && v.length === ok.length && v.every((x, k) => x === ok[k]) ? 1 : 0; }
      case 'numero': return Math.abs(Number(v) - Number(it.correcta)) <= Number(it.tolerancia || 0) ? 1 : 0;
      case 'parejas': { const n = paresValidos(it).length; return Array.isArray(v) && n ? v.slice(0, n).filter((x, k) => Number(x) === k).length / n : 0; }
      case 'versiculo': return Array.isArray(v) && norm(v.join(' ')) === norm(textoVersiculo(it)) ? 1 : 0;
      case 'clasificar': {
        const el = clasifValidos(it); if (!Array.isArray(v) || !el.length) return 0;
        const m = new Map(v.map(p => [Number(p[0]), Number(p[1])]));
        return el.filter(e => m.get(e.i) === e.c).length / el.length;
      }
      case 'error': return Number(v) === tokensError(it).idx ? 1 : 0;
      case 'linea': return Number(v) === lineaDe(it).pos ? 1 : 0;
      case 'huecos': { const ok = palabrasHuecos(it); return Array.isArray(v) && ok.length ? ok.filter((w, k) => norm(v[k]) === norm(w)).length / ok.length : 0; }
      case 'multiple': {
        const val = opcionesValidas(it.opciones).map(x => x.i), ok = new Set(it.correctas.filter(i => val.includes(i))), sel = new Set((Array.isArray(v) ? v : []).map(Number));
        let bien = 0, mal = 0; sel.forEach(i => ok.has(i) ? bien++ : mal++);
        return ok.size ? Math.max(0, bien - mal) / ok.size : 0;
      }
      case 'rafaga': { const a = afirmValidas(it); return Array.isArray(v) && a.length ? a.filter((x, k) => v[k] === !!x.v).length / a.length : 0; }
      case 'palabra': return aceptadasPalabra(it).includes(norm(v)) ? 1 : 0;
      case 'memoria': { const n = paresMem(it).length; return n && v ? Math.min(1, Math.max(0, +v.hechos || 0) / n) : 0; }
    }
  } catch (e) { }
  return 0;
}
const evaluar = (it, v) => fraccion(it, v) >= 1;
function problemasQuiz() {
  const pr = [];
  quiz.items.forEach((it, i) => {
    const m = t => pr.push(`${i + 1}. ${TIPOS[it.tipo].nombre}: ${t}`);
    switch (it.tipo) {
      case 'error': if (tokensError(it).idx < 0) m('falta marcar la palabra equivocada con *asteriscos*'); break;
      case 'parejas': if (paresValidos(it).length < 2) m('necesita al menos 2 parejas completas'); break;
      case 'versiculo': if (palabrasVersiculo(it).length < 2) m('falta el versículo'); break;
      case 'quiensoy': if (!pistasValidas(it).length || !aceptadas(it).length) m('faltan pistas o respuestas aceptadas'); break;
      case 'revela': if (!it.imagen) m('falta la imagen'); break;
      case 'clasificar': if (!clasifValidos(it).length) m('no tiene elementos'); break;
      case 'linea': if (opcionesValidas(it.elementos).length < 3) m('necesita al menos 3 hechos'); break;
      case 'emoji': if (!String(it.emojis || '').trim()) m('faltan los emojis'); break;
      case 'huecos': if (!nHuecos(it) || nHuecos(it) !== palabrasHuecos(it).length) m(`la frase tiene ${nHuecos(it)} espacio(s) ___ y hay ${palabrasHuecos(it).length} palabra(s) correcta(s)`); break;
      case 'rafaga': if (afirmValidas(it).length < 2) m('necesita al menos 2 afirmaciones'); break;
      case 'palabra': if (!letrasPalabra(it.palabra).length) m('falta la palabra'); break;
      case 'zoom': if (!it.imagen) m('falta la imagen'); break;
      case 'audio': if (!it.audio) m('falta el audio'); break;
      case 'memoria': if (paresMem(it).length < 2) m('necesita al menos 2 parejas'); break;
    }
  });
  return pr;
}
function textoCorrecta(it) {
  switch (it.tipo) {
    case 'alternativas': case 'emoji': case 'revela': return it.correctas.map(i => it.opciones[i]).join(' / ');
    case 'quiensoy': return String(it.aceptadas).split(',')[0].trim();
    case 'parejas': return paresValidos(it).map(p => p.a + ' → ' + p.b).join(' · ');
    case 'versiculo': return textoVersiculo(it) + (it.referencia ? ' (' + it.referencia + ')' : '');
    case 'clasificar': return catsDe(it).map((c, ci) => c + ': ' + clasifValidos(it).filter(e => e.c === ci).map(e => e.t).join(', ')).join(' · ');
    case 'error': { const t = tokensError(it); return `«${t.palabra}»` + (it.correctaTxt ? ` debía decir «${it.correctaTxt}»` : ''); }
    case 'huecos': return palabrasHuecos(it).join(' · ');
    case 'multiple': return it.correctas.map(i => it.opciones[i]).filter(Boolean).join(' + ');
    case 'rafaga': return afirmValidas(it).map((a, k) => `${k + 1}: ${a.v ? 'V' : 'F'}`).join(' · ');
    case 'palabra': return it.palabra;
    case 'zoom': case 'audio': return it.correctas.map(i => it.opciones[i]).join(' / ');
    case 'memoria': return paresMem(it).map(x => x.a === x.b ? x.a : x.a + ' = ' + x.b).join(' · ');
    case 'rapido': return it.respuesta || '';
    case 'linea': { const l = lineaDe(it); return l.pos === 0 ? 'Antes de: ' + l.fijos[0] : 'Después de: ' + l.fijos[l.pos - 1]; }
    case 'vf': return it.correcta ? 'Verdadero' : 'Falso';
    case 'completar': return String(it.aceptadas).split(',')[0].trim();
    case 'pin': return '📍 Mira la pantalla';
    case 'ordenar': return opcionesValidas(it.elementos).map(x => x.o).join(' → ');
    case 'numero': return it.correcta + (it.unidad ? ' ' + it.unidad : '');
  }
  return '';
}

}

}

/* Servidores para atravesar redes difíciles (wifi con aislamiento, datos móviles con CGNAT):
   STUN de Google + TURN público de respaldo (Open Relay, sin garantía) + TURN propio opcional de la configuración. */
const ICE_BASE = [
  { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' },
];
function opcionesPeer(cfg) {
  const ice = ICE_BASE.slice();
  if (cfg && cfg.turnUrl) ice.unshift({ urls: String(cfg.turnUrl).split(',').map(x => x.trim()).filter(Boolean), username: cfg.turnUsuario, credential: cfg.turnClave });
  return { config: { iceServers: ice } };
}
function tipoConexion(conn) { // 'directa' o 'respaldo' (pasa por el servidor TURN)
  const pc = conn && conn.peerConnection; if (!pc || !pc.getStats) return Promise.resolve('');
  return pc.getStats().then(st => {
    let par = null; const c = {};
    st.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) par = st.get(r.selectedCandidatePairId); if (r.type === 'local-candidate' || r.type === 'remote-candidate') c[r.id] = r; });
    if (!par) st.forEach(r => { if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected)) par = par || r; });
    if (!par) return '';
    const l = c[par.localCandidateId], r = c[par.remoteCandidateId];
    return (l && l.candidateType === 'relay') || (r && r.candidateType === 'relay') ? 'respaldo' : 'directa';
  }).catch(() => '');
}
function iniciarPeerHost() {
  if (!window.Peer) { H.estado = 'sinpeer'; return; }
  const peer = new Peer(PREFIJO + H.code, opcionesPeer(quiz.config));
  H.peer = peer;
  peer.on('open', () => { H.estado = 'ok'; if (H.fase === 'lobby') renderHost(); });
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { H.code = String(Math.floor(10000 + Math.random() * 90000)); peer.destroy(); iniciarPeerHost(); }
    else if (e.type !== 'peer-unavailable') { H.estado = 'error'; console.warn(e); if (H.fase === 'lobby') renderHost(); }
  });
  peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) { } });
  peer.on('connection', conn => {
    conn.on('open', () => setTimeout(() => tipoConexion(conn).then(t => { const p = H && H.players[conn.pid]; if (p && t) { p.via = t; if (H.fase === 'lobby') renderHost(); } }), 2000));
    conn.on('data', d => alRecibirHost(conn, d));
    conn.on('close', () => { const p = H && H.players[conn.pid]; if (p && p.conn === conn) { p.online = false; if (H.fase === 'lobby') renderHost(); } });

}
function equiposDe() {

    <button class="sec big" style="width:100%" data-a="entrar">Entrar al juego ${ic('arrow_forward')}</button></div></div></div>`;

function marcoJ(cuerpo, bg, preg) {

function pantallaJ(icono, msg, bg, extra = '') { clearInterval(P.tInt); marcoJ(`<div class="estado-big">${icono}</div><h2>${msg}</h2>${extra}`, bg); }
function conectarJugador() {
  if (!window.Peer) return pantallaJ('📵', 'No se pudo cargar la conexión. Revisa tu internet.', '#484550', '<button data-a="reintentar">Reintentar</button>');
  P.peer = new Peer(opcionesPeer());

    if (e.type === 'peer-unavailable') pantallaJ('🔍', 'No se encontró la sala ' + esc(P.code) + '. Revisa el código.', '#484550', '<button data-a="reintentar">Reintentar</button>');
    else if (!P.conn || !P.conn.open) pantallaJ('📵', 'Problema de conexión', '#484550', AYUDA_RED);

const AYUDA_RED = `<div class="ayuda-red"><b>¿No conecta?</b><ul><li>Revisa que el código sea el de la pantalla.</li><li>Prueba cambiando de wifi a datos móviles (o al revés).</li>
  <li>En el wifi de la iglesia, algunas redes bloquean la conexión entre equipos.</li></ul></div><button class="pri big" data-a="reintentar">Reintentar</button>`;
function conectarConn() {
  if (P.kicked || P.fin) return;
  const c = P.peer.connect(PREFIJO + P.code, { reliable: true });
  P.conn = c; P.visto = Date.now();
  clearTimeout(P.tCon);
  P.tCon = setTimeout(() => { if (P.conn === c && !c.open) { P.intentos = (P.intentos || 0) + 1; pantallaJ('📵', 'No se pudo conectar', '#484550', AYUDA_RED); } }, 15000);
  c.on('open', () => { clearTimeout(P.tCon); P.intentos = 0; P.visto = Date.now(); c.send({ t: 'join', pid: P.pid, name: P.name, avatar: P.avatar }); });
  c.on('data', alRecibirJ);
  c.on('error', e => console.warn('conexión', e));
  c.on('close', () => reconectarJ(c));
  clearInterval(P.latido);
  P.latido = setInterval(() => { // si la pantalla no habla en 20 s, reconectar
    if (P.kicked || P.fin || !P.conn || !P.conn.open) return;
    if (Date.now() - P.visto > 20000) { try { P.conn.close(); } catch (_) { } reconectarJ(P.conn); }

  setTimeout(() => {
    P.reconectando = false;

    if (P.peer.disconnected) { try { P.peer.reconnect(); } catch (_) { } }
    conectarConn();
  }, 2000);
}

    case 'welcome': P.color = d.color; P.titulo = d.titulo; P.equipos = d.equipos || []; P.eq = d.eq; P.filtro = d.filtro || null; break;
    case 'rechazo': P.kicked = true; try { P.peer.destroy(); } catch (e) { } vistaJugador(P.code, d.msg); break;

      const corr = d.correcta ? `<p>Respuesta: <b>${esc(d.correcta)}</b></p>` : '';
      const pos = d.equipo ? `<p>Tu equipo <b>${esc(d.equipo)}</b> va en el lugar <b>${d.rank}</b> de ${d.n}</p>` : `<p>Vas en el lugar <b>${d.rank}</b> de ${d.n}</p>`;

      h += `<textarea id="jtxt" maxlength="140" rows="4" placeholder="Escribe tu mensaje…" style="max-width:480px;font-size:1.15rem"></textarea><p class="aviso" id="javiso" hidden></p><button class="pri big jbtn" data-a="jenviar">Enviar</button>`; break;
    case 'escala':
      h += `<div class="jescala">${[1, 2, 3, 4, 5].map(v => `<button data-a="jv" data-v="${v}" style="background:${ESCALA[v - 1]}">${v}</button>`).join('')}</div>
        <div class="jescala-et"><span>1 = ${esc(q.min)}</span><span>5 = ${esc(q.max)}</span></div>`; break;
  }
  marcoJ(h, null, true); overlayPausa();
  const r = $('#jrange'); if (r) r.oninput = () => $('#jval').textContent = r.value;
  if (q.tipo === 'versiculo') renderArmado();
  if (q.tipo === 'huecos') { P.huecos = Array((String(q.frase).match(/_{3,}/g) || []).length).fill(null); renderHuecos(); }
  if (q.tipo === 'multiple') P.multi = new Set();
  if (q.tipo === 'rafaga') { P.raf = []; renderRafaga(); }
  if (q.tipo === 'memoria') { P.mem = { abiertas: [], hechas: new Set(), bloqueo: false }; renderMemoria(); }
  if (q.tipo === 'dibujo') iniciarDibujo();
  const t = $('#jtxt'); if (t) { t.focus(); t.onkeydown = e => { if (e.key === 'Enter') ACC.jenviar(); }; }
  clearInterval(P.tInt);
  const tick = () => {
    if (P.pausa) return;
    const s = Math.max(0, Math.ceil((P.limite - Date.now()) / 1000)); const el = $('#jt'); if (el) el.textContent = s + 's';
    const bar = $('#jbar'); if (bar) bar.style.width = Math.max(0, (P.limite - Date.now()) / (q.tiempo * 1000) * 100) + '%';
    if (q.tipo === 'palabra') pintarMascara();
    if (q.tipo === 'quiensoy') { const T = q.tiempo * 1000, k = pistasVisibles(q.pistas.length, T - (P.limite - Date.now()), T); app.querySelectorAll('#jpistas li').forEach((li, j) => li.classList.toggle('off', j >= k)); }
    if (s <= 0) { clearInterval(P.tInt); }
  };
  tick(); P.tInt = setInterval(tick, 250);
}
function renderHuecos() {
  const q = P.q; if (!q) return; let k = 0;
  $('#jfrase').innerHTML = esc(q.frase).replace(/_{3,}/g, () => { const j = k++, i = P.huecos[j]; return i == null ? `<span class="hueco">${j + 1}</span>` : `<button class="hueco lleno" data-a="jhq" data-k="${j}">${esc(q.banco[i])}</button>`; });
  $('#jbanco').innerHTML = q.banco.map((w, i) => P.huecos.includes(i) ? '' : `<button data-a="jhb" data-i="${i}">${esc(w)}</button>`).join('');
}
function renderRafaga() {
  const q = P.q, k = P.raf.length; if (!q) return;
  $('#jraf').innerHTML = `<p class="muted">${k + 1} de ${q.afirm.length}</p><div class="jq sub raf-af">${esc(q.afirm[k])}</div>
    <div class="jopts"><button data-a="jrf" data-v="1" style="--oc:#059669"><span class="f">V</span>Verdadero</button><button data-a="jrf" data-v="0" style="--oc:#BA1A1A"><span class="f">F</span>Falso</button></div>`;
}
function pintarMascara() {
  const q = P.q, el = $('#jmasc'); if (!q || !el) return;
  const T = q.tiempo * 1000, ms = T - (P.limite - Date.now()), k = letrasVisibles(q.orden.length, ms, T), rank = {}; q.orden.forEach((ix, j) => rank[ix] = j);
  el.innerHTML = [...q.palabra].map((c, i) => c === ' ' ? '<i></i>' : rank[i] == null ? `<span class="on">${esc(c)}</span>` : `<span class="${rank[i] < k ? 'on' : ''}">${rank[i] < k ? esc(c) : ''}</span>`).join('');
}
function renderMemoria() {
  const q = P.q, m = P.mem; if (!q) return;
  $('#jmem').innerHTML = q.cartas.map((c, i) => { const vis = m.abiertas.includes(i) || m.hechas.has(c.k);
    return `<button class="carta ${vis ? 'vis' : ''} ${m.hechas.has(c.k) ? 'hecha' : ''}" data-a="jmc" data-i="${i}">${vis ? esc(c.t) : '?'}</button>`; }).join('');
  $('#jmemc').textContent = `Parejas: ${m.hechas.size} / ${q.cartas.length / 2}`;
}
function voltearCarta(i) {
  const q = P.q, m = P.mem; if (!q || m.bloqueo) return;
  const c = q.cartas[i]; if (!c || m.hechas.has(c.k) || m.abiertas.includes(i)) return;
  m.abiertas.push(i); renderMemoria();
  if (m.abiertas.length < 2) return;
  const [a, b] = m.abiertas.map(j => q.cartas[j]);
  if (a.k === b.k) {
    m.hechas.add(a.k); m.abiertas = []; navigator.vibrate?.(40); renderMemoria();
    const val = { hechos: m.hechas.size };
    if (m.hechas.size >= q.cartas.length / 2) setTimeout(() => responder(val), 300);
    else try { P.conn.send({ t: 'prog', idx: q.idx, val }); } catch (_) { }
  } else { m.bloqueo = true; setTimeout(() => { m.abiertas = []; m.bloqueo = false; renderMemoria(); }, 800); }
}
function iniciarDibujo() {
  const cv = $('#jcanvas'); if (!cv) return;
  P.dib = { color: '#1C1B20', grosor: 10, trazos: [] };
  const pos = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * cv.width, (e.clientY - r.top) / r.height * cv.height]; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); P.dib.trazos.push({ c: P.dib.color, g: P.dib.grosor, p: [pos(e)] }); redibujar(); };
  cv.onpointermove = e => { const t = P.dib.trazos[P.dib.trazos.length - 1]; if (!t || !e.buttons && e.pointerType === 'mouse') return; if (e.pressure === 0 && e.pointerType !== 'mouse') return; t.p.push(pos(e)); redibujar(); };
  cv.onpointerup = () => { };
  redibujar();
}
function redibujar() {
  const cv = $('#jcanvas'); if (!cv) return;
  const x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, cv.width, cv.height); x.lineCap = x.lineJoin = 'round';
  P.dib.trazos.forEach(t => { x.strokeStyle = t.c; x.fillStyle = t.c; x.lineWidth = t.g;
    if (t.p.length === 1) { x.beginPath(); x.arc(t.p[0][0], t.p[0][1], t.g / 2, 0, 7); x.fill(); return; }
    x.beginPath(); x.moveTo(...t.p[0]); t.p.slice(1).forEach(q => x.lineTo(...q)); x.stroke(); });
}
const exportarDibujo = () => { const cv = $('#jcanvas'); return cv ? cv.toDataURL('image/jpeg', 0.7) : ''; };
function overlayPausa() {
  const j = $('.jug'), o = $('#jpausa');
  if (P.pausa && P.q && j && !o) j.insertAdjacentHTML('beforeend', `<div id="jpausa" class="jpausa">${ic('pause_circle', 'fill')}<b>Pausa</b><span>Espera un momento…</span></div>`);
  else if (!P.pausa && o) o.remove();
}
function renderArmado() {
  const q = P.q; if (!q) return;
  $('#jarm').innerHTML = P.armado.length ? P.armado.map((i, k) => `<button data-a="jvq" data-k="${k}">${esc(q.palabras[i])}</button>`).join('') : '<span class="ph">Toca las palabras en orden…</span>';
  $('#jbanco').innerHTML = q.palabras.map((w, i) => P.armado.includes(i) ? '' : `<button data-a="jvp" data-i="${i}">${esc(w)}</button>`).join('');
}
function renderEquipos() {
  clearInterval(P.tInt);
  marcoJ(`<div class="estado-big">✅</div><h2>¡Estás dentro!</h2><p class="muted">Elige tu equipo:</p>
    <div class="jeq">${P.equipos.map((n, i) => `<button data-a="jeq" data-i="${i}" class="${P.eq === i ? 'on' : ''}" style="background:${COLORES[i % 6]}">${P.eq === i ? '✔ ' : ''}${esc(n)}</button>`).join('')}</div>
    <p class="muted">Espera a que comience.</p>`);
}
function filasOrden() {
  return P.orden.map((x, k) => `<div><b>${k + 1}</b><span>${esc(x.o)}</span><button data-a="jmov" data-i="${k}" data-d="-1">▲</button><button data-a="jmov" data-i="${k}" data-d="1">▼</button></div>`).join('');
}

iniciar();
</script>
</body>
